apiVersion: openworld/v1alpha1
kind: StateCompilerProfile
metadata:
  name: executive-summary-state-compiler
spec:
  worldViewRef: views/executive.yaml
  outputContract: EffectiveWorldState
  outputSchema:
    fields:
    - kpi.revenue
    - kpi.operating_margin
    - risk.open
    - initiative.status
    - forecast.revenue
  bindings:
    kpi.revenue: {from: BI.kpi_revenue, value: amount, select: latest}
    kpi.operating_margin: {from: BI.kpi_operating_margin, value: ratio, select: latest}
    risk.open: {from: GRC.risk, value: title, select: all}
    initiative.status: {from: PMO.initiative, value: status, select: latest}
    forecast.revenue: {from: FPA.forecast_revenue, value: amount, select: latest}
  traceRequired: true
