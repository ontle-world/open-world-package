name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      # The newest Python also installs the rdf and shacl extras, so RDF export (and its shapes), kg check, and SPARQL extraction are tested.
      - run: python -m pip install -e ${{ matrix.python-version == '3.14' && '.[rdf,shacl]' || '.' }}
      # The site build (package catalog) needs markdown; tests/test_site.py runs where it is installed.
      - if: matrix.python-version == '3.14'
        run: python -m pip install markdown==3.11
      - run: ./scripts/golden_smoke.sh
      # The community package list (registry/packages.yaml): every listed archive fetched and checked.
      - if: matrix.python-version == '3.14'
        run: python scripts/registry.py check
      # Unused imports, undefined names, and shadowed loop variables (pyflakes; TypeScript checks the same with noUnused*).
      - if: matrix.python-version == '3.14'
        run: python -m pip install pyflakes && python -m pyflakes src/ontle scripts tests

  typescript-conformance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["24", "26"]
    defaults:
      run:
        working-directory: implementations/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: implementations/typescript/package-lock.json
      - run: npm ci
      - run: npm test

  parity:
    # Mutants of the conformance fixtures: Python and TypeScript must agree on each (scripts/parity_fuzz.py).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: implementations/typescript/package-lock.json
      - run: python -m pip install -e .
      - run: npm ci && npm run build
        working-directory: implementations/typescript
      - run: python scripts/parity_fuzz.py --seeds 3 --per-case 3
      - run: python scripts/report_parity.py
      # The browser bundle resolves dependencies through a served catalog index (the Playground).
      - run: npm run bundle
        working-directory: implementations/typescript
      - run: python -m pip install markdown==3.11 && python -m unittest tests.test_site tests.test_implementation_constants -v

  alignments:
    # Reasons over the OWP vocabulary and the alignment packages with HermiT (scripts/check_alignments.sh).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install -e .
      - run: ./scripts/check_alignments.sh
