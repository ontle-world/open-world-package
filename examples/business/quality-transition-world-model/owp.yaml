apiVersion: openworld/v1alpha1
kind: WorldModelPackage
metadata:
  namespace: openworld-examples
  name: quality-transition-world-model
  version: 0.1.0
  title: Quality Transition World Model
  license: Apache-2.0
spec:
  domains:
  - manufacturing
  - quality
  dependencies:
  - openworld-examples/manufacturing-quality-world@0.1.0
  worldModel:
    description: WORLDMODEL.md
    roles:
    - state_estimation
    - dynamics_prediction
    - outcome_prediction
    - decision_support
    semanticGrounding:
      worldRef: openworld-examples/manufacturing-quality-world@0.1.0
      compatibleWorldViews:
      - openworld-examples/manufacturing-quality-world@0.1.0#views/quality-incident-task.yaml
      compatibleStateCompilers:
      - openworld-examples/manufacturing-quality-world@0.1.0#state/quality-incident-compiler.yaml
    inputs:
      contract: EffectiveWorldState
    outputs:
    - predicted_transition
    - expected_outcome
    - risk
    - uncertainty
    validity:
      limitations:
      - reference_contract_only
    representation:
      input: structured_state
      adapterRef: models/adapter.yaml
  assets:
  - kind: ModelArtifact
    path: models/model-artifact.yaml
  - kind: RepresentationAdapterProfile
    path: models/adapter.yaml
  - kind: EvaluationProfile
    path: eval/basic.yaml
