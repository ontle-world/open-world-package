apiVersion: openworld/v1alpha1
kind: WorldPackage
metadata:
  namespace: openworld-examples
  name: sales-prioritization-world
  version: 0.1.0
  title: Sales Prioritization World
  license: Apache-2.0
spec:
  domains:
  - sales
  world:
    description: WORLD.md
    definition: Accounts, opportunities, sales activity, territories, quotas, and
      the priorities assigned to accounts.
    boundary:
      included:
      - account
      - opportunity
      - activity
      - territory
      - territory_assignment
      - quota
      - priority
      - global_pipeline
      excluded:
      - complete_crm_implementation
      - pricing_engine
    defaultView: views/account-manager.yaml
    defaultStateCompiler: state/account-priority-compiler.yaml
  conformance:
    profile: model-ready
  validity:
    limitations:
    - Illustrative example; no real CRM data. Uses experimental asset kinds (spec
      Appendix C).
  assets:
  - kind: PackageExample
    path: examples/observations.yaml
  - kind: PackageExample
    path: examples/expected-ews.yaml
