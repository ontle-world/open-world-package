name: Bug report
description: Report a reproducible bug in ONTLE/OWP tooling
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest package/command sequence that reproduces the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ONTLE version
