apiVersion: openworld/v1alpha1
kind: OntologyPackage
metadata:
  namespace: openworld
  name: owp-align-bfo
  version: 0.1.0
  title: OWP to BFO 2020 and IAO
  license: CC-BY-4.0
spec:
  dependencies:
  - openworld/owp-vocabulary@0.1.0
  ontology:
