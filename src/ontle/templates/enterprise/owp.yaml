apiVersion: openworld/v1alpha1
kind: WorldPackage
metadata:
  namespace: example
  name: enterprise-world
  version: 0.1.0
  title: Enterprise World
  description: One line on the part of the enterprise this World represents.
  license: Apache-2.0
spec:
  domains:
  - enterprise
  world:
    description: WORLD.md
    definition: A task-ready enterprise representation that can bind native systems
      through explicit interfaces.
    boundary:
      included:
      - item
      - organization
      - work
      - decisions
      - actions
      - outcomes
      excluded:
      - complete-copy-of-all-enterprise-data
    defaultView: views/default.yaml
    defaultStateCompiler: state/default-compiler.yaml
  conformance:
    profile: stateful
  capabilities:
  - explore
  - state_tracking
  validity:
    limitations: []
  assets:
  - kind: PackageExample
    path: examples/observations.yaml
  - kind: PackageExample
    path: examples/expected-ews.yaml
