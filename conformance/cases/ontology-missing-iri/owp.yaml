apiVersion: openworld/v1alpha1
kind: OntologyPackage
metadata:
  namespace: conformance
  name: onto
  version: 0.1.0
spec:
  ontology:
    description: ONTOLOGY.md
    entrypoints:
    - {path: semantics/core.yaml, format: owp-yaml, role: schema}
    prefixes: {q: https://example.org/q#}
  conformance:
    profile: vocabulary
  assets: []
