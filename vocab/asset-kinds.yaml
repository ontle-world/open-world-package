apiVersion: openworld/v1alpha1
kind: AssetKindVocabulary
# Public asset-kind vocabulary (spec section 8). The vocabulary is open: an
# unqualified kind outside it is a warning; an extension kind <name>:<Kind> is
# governed by spec section 13.
#
# stability:
#   standard      part of this specification's vocabulary
#   experimental  may change or be removed; using it is a warning (asset.kind-experimental)
#   reserved      name kept for a future definition; it has no schema or rules yet, so using it is a
#                 warning (asset.kind-reserved)
#
# Group names are informative and do not affect validation.
#
# Name suffixes: ...Package is reserved for package kinds (spec section 3); ...Contract is a promise
# another party may rely on; ...Profile describes something (a View, an actor, a verifier, a model input).
groups:
  semanticWorld:
    SemanticProfile: {stability: standard}
    OntologyTermIndex: {stability: standard}
    WorldViewProfile: {stability: standard}
    StateCompilerProfile: {stability: standard}
    SemanticBinding: {stability: standard}
  interfaceIntegration:
    SourceSystemSchemaProfile: {stability: standard}
    SourceAdapterProfile: {stability: reserved}
    IdentityResolutionProfile: {stability: reserved}
    ObservationAcquisitionProfile: {stability: standard}
    ActionBindingProfile: {stability: standard}
    CommitContract: {stability: standard}
    EffectVerificationProfile: {stability: standard}
  referenceProfiles:
    ReferenceEnterpriseProfile: {stability: reserved}
    ReferenceIndustryProfile: {stability: reserved}
    ScenarioProfile: {stability: standard}
    EnvironmentProfile: {stability: standard}
  modelRepresentation:
    ModelArtifact: {stability: standard}
    RepresentationAdapterProfile: {stability: standard}
  capabilityOperational:
    CapabilityContract: {stability: standard}
    SkillProfile: {stability: reserved}
    ToolProfile: {stability: reserved}
    AgentProfile: {stability: standard}
    WorkflowProfile: {stability: reserved}
    OperationalAsset: {stability: reserved}
  evaluationTestEvidence:
    Dataset: {stability: standard}
    ReferenceFixture: {stability: reserved}
    NegativeFixture: {stability: reserved}
    BenchmarkCase: {stability: reserved}
    AcceptanceCase: {stability: reserved}
    EvaluationProfile: {stability: standard}
    VerifierProfile: {stability: standard}
    CompatibilityEvidence: {stability: standard}
  governancePublication:
    Attestation: {stability: reserved}
  taskWork:
    TaskSetProfile: {stability: standard}
    WorkPatternProfile: {stability: standard}
  knowledge:
    KnowledgeAsset: {stability: standard}
    KnowledgeExtractionProfile: {stability: standard}
  artifactRepresentation:
    ArtifactContract: {stability: standard}
    ArtifactTemplate: {stability: experimental}
    ConsumerRepresentationProfile: {stability: standard}
  actorAuthority:
    ActorProfile: {stability: standard}
    RoleProfile: {stability: standard}
    DelegationProfile: {stability: standard}
  packageSupport:
    PackageExample: {stability: standard}
