apiVersion: openworld/v1alpha1
kind: WorldPackage
metadata:
  namespace: example
  name: my-world
  version: 0.1.0
  title: My World
  description: One line on the target world this package represents.
  license: Apache-2.0
spec:
  domains: []
  world:
    description: WORLD.md
    definition: A minimal explicit representation for a target world.
    boundary:
      included: [item]
      excluded: []
    defaultView: views/default.yaml
    defaultStateCompiler: state/default-compiler.yaml
  conformance:
    profile: stateful
  capabilities:
  - explore
  validity:
    limitations: []
  assets:
  - kind: PackageExample
    path: examples/observations.yaml
  - kind: PackageExample
    path: examples/expected-ews.yaml
