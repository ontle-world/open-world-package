apiVersion: openworld/v1alpha1
kind: SemanticBinding
metadata: {name: terms}
spec:
  terms: {claim: q:Claim, lot: q:Lot}
  fields:
    claim.status: {class: q:Claim, path: [q:claimStatus], values: {scheme: q:ClaimStatuses}}
    lot.genealogy: {class: q:Lot, path: [q:derivedFrom], values: {base: "claim-status/"}}
  observationTypes: {QMS.claim: q:Claim}
