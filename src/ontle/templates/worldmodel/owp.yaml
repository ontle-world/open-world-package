apiVersion: openworld/v1alpha1
kind: WorldModelPackage
metadata:
  namespace: example
  name: my-world-model
  version: 0.1.0
  title: My World Model
  license: Apache-2.0
spec:
  domains: []
  worldModel:
    description: WORLDMODEL.md
    roles:
    - dynamics_prediction
    semanticGrounding:
      worldRef: replace-with-namespace/replace-with-world@0.1.0
      compatibleWorldViews:
      - replace-with-namespace/replace-with-world@0.1.0#views/default.yaml
      compatibleStateCompilers:
      - replace-with-namespace/replace-with-world@0.1.0#state/default-compiler.yaml
    inputs:
      contract: EffectiveWorldState
    outputs:
    - predicted_transition
    - uncertainty
    representation:
      input: structured_state
      adapterRef: models/adapter.yaml
    validity:
      limitations:
      - Reference contract only; no implementation is bundled.
