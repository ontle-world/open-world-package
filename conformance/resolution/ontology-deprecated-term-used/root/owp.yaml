apiVersion: openworld/v1alpha1
kind: OntologyPackage
metadata: {namespace: conformance, name: domain, version: 0.1.0}
spec:
  dependencies: [conformance/upper@1.0.0]
  ontology:
    description: ONTOLOGY.md
    iri: https://example.org/domain#
    prefixes: {d: "https://example.org/domain#", up: "https://example.org/upper#"}
    entrypoints:
    - {path: semantics/core.yaml, format: owp-yaml, role: schema}
