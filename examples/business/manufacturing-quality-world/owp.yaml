apiVersion: openworld/v1alpha1
kind: WorldPackage
metadata:
  namespace: openworld-examples
  name: manufacturing-quality-world
  version: 0.1.0
  title: Manufacturing Quality World
  license: Apache-2.0
spec:
  dependencies:
  - openworld-examples/quality-ontology@0.1.0
  domains:
  - manufacturing
  - quality
  world:
    description: WORLD.md
    definition: Quality incidents, lots, equipment, evidence, constraints, decisions,
      CAPA actions, and outcomes.
    boundary:
      included:
      - quality_incident
      - lot
      - equipment
      - inspection
      - claim
      - evidence
      - constraint
      - decision
      - capa
      - outcome
      excluded:
      - complete_mes_implementation
      - complete_qms_implementation
    defaultView: views/quality-incident-task.yaml
    defaultStateCompiler: state/quality-incident-compiler.yaml
    semanticBinding: semantics/quality-terms.yaml
  conformance:
    profile: action-ready
  capabilities:
  - explore
  - state_tracking
  - audit
  - decision_support
  validity:
    limitations:
    - Reference semantic package; source systems remain external.
  assets:
  - kind: PackageExample
    path: examples/basic.yaml
  - kind: PackageExample
    path: examples/observations.yaml
  - kind: PackageExample
    path: examples/expected-ews.yaml
  - kind: PackageExample
    path: examples/kg-observations.yaml
  - kind: PackageExample
    path: examples/expected-ews-with-kg.yaml
