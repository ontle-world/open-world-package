apiVersion: openworld/v1alpha1
kind: WorldModelPackage
metadata:
  namespace: conformance
  name: model
  version: 0.1.0
spec:
  dependencies:
  - world@0.1.0
  worldModel:
    description: WORLDMODEL.md
    roles:
    - dynamics_prediction
    semanticGrounding:
      worldRef: world@0.1.0
      compatibleWorldViews:
      - world@0.1.0#views/task.yaml
      compatibleStateCompilers:
      - world@0.1.0#state/task-compiler.yaml
    inputs:
      contract: EffectiveWorldState
    representation:
      adapterRef: models/adapter.yaml
