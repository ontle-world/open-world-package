apiVersion: openworld/v1alpha1
kind: ValueSetVocabulary
# Value sets. For a closed set (open: false, or no open key), a value outside it is an error with the rule id of the field;
# for an open set (open: true), which grows with use, it is the warning value.unknown (spec sections 15-19).
# An extension value <extension>:<value> is accepted when the extension is declared (section 13).
# Labels are informative. A work pattern's family is its workNodeFamilies value.
valueSets:
  workPatterns:
    stability: standard
    open: true
    usedBy: WorkPatternProfile.spec.pattern.kind, TaskSetProfile.spec.task.workPatterns
    values:
      observe: {label: Observe / Monitor, family: observe_knowledge}
      detect: {label: Detect / Triage, family: observe_knowledge}
      retrieve: {label: Retrieve / Research, family: observe_knowledge}
      summarize: {label: Summarize / Synthesize, family: analyze_reason}
      analyze: {label: Analyze / Classify, family: analyze_reason}
      compare: {label: Compare, family: analyze_reason}
      diagnose: {label: Diagnose / RCA, family: analyze_reason}
      forecast: {label: Forecast / Predict, family: analyze_reason}
      prioritize: {label: Prioritize / Rank, family: decide_plan}
      recommend: {label: Recommend / Decide, family: decide_plan}
      allocate: {label: Allocate / Assign, family: decide_plan}
      schedule: {label: Schedule / Plan, family: decide_plan}
      optimize: {label: Optimize, family: decide_plan}
      simulate: {label: Simulate / What-if, family: analyze_reason}
      create: {label: Create / Generate, family: create_modify}
      transform: {label: Transform / Adapt, family: create_modify}
      review: {label: Review / Verify, family: evaluate_recover}
      approve: {label: Approve / Govern, family: decide_plan}
      execute: {label: Execute / Coordinate, family: execute_operate}
      publish: {label: Publish / Deliver, family: execute_operate}
      evaluate: {label: Evaluate, family: evaluate_recover}
      learn: {label: Learn / Update, family: evaluate_recover}
  artifactTypes:
    stability: standard
    open: true
    usedBy: ArtifactContract.spec.artifact.type
    values:
      document: {label: Document}
      report: {label: Report}
      proposal: {label: Proposal}
      presentation: {label: Presentation}
      spreadsheet: {label: Spreadsheet / Table}
      dataset: {label: Dataset}
      database_object: {label: Database object}
      knowledge_graph: {label: Knowledge graph}
      form: {label: Form}
      dashboard: {label: Dashboard / Board}
      image: {label: Image}
      audio: {label: Audio}
      video: {label: Video}
      code: {label: Code}
      app: {label: App / Mini SaaS}
      workflow: {label: Workflow}
      agent_configuration: {label: Agent / prompt configuration}
      model_configuration: {label: Model / model configuration}
      evaluation_asset: {label: Evaluation asset}
      template: {label: Template}
  artifactRepresentations:
    stability: standard
    open: true
    usedBy: ArtifactContract.spec.artifact.representation
    values:
      document: {label: Document}
      table: {label: Relational table}
      graph: {label: Graph}
      board: {label: Board}
      form: {label: Form}
      media: {label: "Image, audio, or video"}
      code: {label: Source code}
      configuration: {label: Configuration}
  actorKinds:
    stability: standard
    open: false
    usedBy: ConsumerRepresentationProfile.spec.actor.kind
    values:
      human: {label: Human}
      agent: {label: AI agent}
      model: {label: Model}
      system: {label: System}
  knowledgeRoles:
    stability: standard
    open: true
    usedBy: KnowledgeAsset.spec.roles
    values:
      source: {label: Source}
      evidence: {label: Evidence}
      claim: {label: Claim}
      rule: {label: Rule}
      procedure: {label: Procedure}
      definition: {label: Definition}
      graph: {label: Graph}
      glossary: {label: Glossary}
  knowledgeRepresentations:
    stability: standard
    open: false
    usedBy: KnowledgeAsset.spec.representation
    values:
      graph: {label: Graph}
      table: {label: Table}
      documents: {label: Documents}
      rules: {label: Rules}
      index: {label: Retrieval index}
  queryLanguages:
    stability: standard
    open: false
    usedBy: KnowledgeExtractionProfile.spec.query.language
    values:
      sparql: {label: SPARQL 1.1}
      opencypher: {label: openCypher}
      gql: {label: ISO GQL}
  workNodeFamilies:
    stability: standard
    open: false
    usedBy: WorkPatternProfile.spec.graph.nodes[].family, WorkPatternProfile.spec.pattern.family
    values:
      observe_knowledge: {label: Observe / Knowledge}
      analyze_reason: {label: Analyze / Reason}
      create_modify: {label: Create / Modify}
      decide_plan: {label: Decide / Plan}
      execute_operate: {label: Execute / Operate}
      evaluate_recover: {label: Evaluate / Recover}
  artifactOperations:
    stability: standard
    open: true
    usedBy: ArtifactContract.spec.allowedOperations
    values:
      create: {label: Create}
      inspect: {label: Inspect}
      edit: {label: Edit}
      transform: {label: Transform}
      branch: {label: Branch}
      merge: {label: Merge}
      compare: {label: Compare}
      validate: {label: Validate}
      version: {label: Version}
      restore: {label: Restore}
      supersede: {label: Supersede}
      share: {label: Share}
      handoff: {label: Hand off}
      publish: {label: Publish}
      deliver: {label: Deliver}
      commit: {label: Commit}
      deploy: {label: Deploy}
      activate: {label: Activate}
  actorTypes:
    stability: standard
    open: false
    usedBy: ActorProfile.spec.actorType
    values:
      human: {label: Human}
      ai_agent: {label: AI agent}
      team: {label: Team}
      organization: {label: Organization}
      external_institution: {label: External institution}
      automated_system: {label: Automated system}
  assessmentKinds:
    stability: standard
    usedBy: EvaluationProfile.spec.assessmentKind
    values:
      verification: {label: Verification, description: "whether conditions, facts, or specifications are met"}
      validation: {label: Validation, description: whether the subject fits its purpose}
      evaluation: {label: Evaluation, description: quality or performance judged against criteria}
      review: {label: Review, description: an examination activity}
      approval: {label: Approval, description: an authorized decision to use or execute}
  evaluationSubjects:
    stability: standard
    usedBy: EvaluationProfile.spec.subject.kind
    values:
      model: {label: Model}
      agent: {label: Agent}
      workflow: {label: Workflow}
      artifact: {label: Artifact}
      decision: {label: Decision}
      process: {label: Process}
      capability: {label: Capability}
      environment: {label: Environment}
  scenarioEngines:
    stability: standard
    usedBy: ScenarioProfile.spec.engine.kind
    values:
      rule: {label: Rule}
      score_ranking: {label: Score / ranking}
      optimization: {label: Optimization}
      simulation: {label: Simulation}
      ml_prediction: {label: ML prediction}
      world_model: {label: World model}
      llm_reasoning: {label: LLM or agent reasoning}
