apiVersion: openworld/v1alpha1
kind: WorldViewProfile
metadata:
  name: quality-incident-task-view
spec:
  purpose:
    task: quality_incident_rca_capa
    actorScope: quality_manager_or_authorized_actor
    objective: resolve_incident_with_evidence_and_governed_action
  projection:
    include:
    - quality_incident
    - lot
    - equipment
    - inspection
    - claim
    - evidence
    - constraint
    - decision
    - capa
    - outcome
    principle: minimal_sufficient_representation
    timeScope: task_declared
    scale: task_declared
    resolution: task_declared
  conditioning:
    authorityScope: task_declared
    actorRef: actors/quality-manager.yaml
    roleRefs: [roles/quality-manager.yaml]
    taskRef: tasks/claim-rca.yaml
