name: build-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m pip install -e .
      # The tag is v<CHANGELOG version>, the package version matches it, and RELEASE_MANIFEST.json matches the tree.
      - name: Check version and manifest
        run: |
          version="${GITHUB_REF_NAME#v}"
          python - "$version" <<'PY'
          import re, sys
          from packaging.version import Version
          import ontle
          tag = sys.argv[1]
          assert Version(tag) == Version(ontle.__version__), f"tag {tag} != package {ontle.__version__}"
          import json
          ts = json.load(open("implementations/typescript/package.json", encoding="utf-8"))["version"]
          assert ts == tag, f"tag {tag} != TypeScript implementation {ts}"
          assert re.search(rf"^## {re.escape(tag)}( |$)", open("CHANGELOG.md", encoding="utf-8").read(), re.M), f"no CHANGELOG section {tag}"
          PY
          python scripts/release_manifest.py --check
      - run: python -m build
      - run: python -m twine check --strict dist/*  # the README renders on PyPI
      - run: ./scripts/golden_smoke.sh
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v h="## ${version}" 'index($0, h) == 1 {f = 1; next} f && /^## / {exit} f' CHANGELOG.md > notes.md
          prerelease=$(case "$version" in *-*) echo --prerelease;; esac)
          gh release create "${GITHUB_REF_NAME}" dist/* RELEASE_MANIFEST.json --title "${GITHUB_REF_NAME}" --notes-file notes.md $prerelease

  # PyPI Trusted Publishing: pypi.org lists this repository, workflow release.yml, and environment pypi as the
  # publisher of the `ontle` project, so no token is stored. Versions on PyPI cannot be replaced.
  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ontle
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
