apiVersion: openworld/v1alpha1
kind: StateCompilerProfile
metadata:
  name: task-compiler
spec:
  worldViewRef: views/task.yaml
  outputContract: EffectiveWorldState
  outputSchema:
    fields: [m.health, m.health_estimate]
    perSubject: [m.health, m.health_estimate]
    latent: [m.health_estimate]
  bindings:
    m.health: {from: m.health, value: v, select: latest}
    m.health_estimate: {estimate: {from: m.health, value: v, select: latest}}
