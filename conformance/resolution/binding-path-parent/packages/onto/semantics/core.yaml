apiVersion: openworld/v1alpha1
kind: SemanticProfile
metadata: {name: core}
spec:
  types:
  - id: q:Record
    properties:
    - {id: q:recordedBy}
  - id: q:Claim
    subClassOf: q:Record
    properties:
    - {id: q:claimStatus}
  - id: q:Lot
    properties:
    - {id: q:derivedFrom, range: q:Lot}
  - id: q:ProposeCapa
