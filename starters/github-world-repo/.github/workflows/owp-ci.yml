name: owp-ci
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - name: Install released ONTLE CLI
        run: python -m pip install --pre ontle  # pin a version, e.g. ontle==0.2.0a5
      - run: ontle validate .
      - run: ontle inspect .
      - run: ontle pack .
