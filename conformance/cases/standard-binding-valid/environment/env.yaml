apiVersion: openworld/v1alpha1
kind: EnvironmentProfile
metadata:
  name: env
spec:
  standardBindings:
    actions:
      standard: ros2
      terms:
        grasp: control_msgs/action/GripperCommand
    scene:
      standard: openusd
      ref:
        status: unbound
    dataset:
      standard: lerobot
      license: Apache-2.0
      ref:
        provider: huggingface
        uri: hf://datasets/conformance/episodes
        revision: 0123456789abcdef0123456789abcdef01234567
