apiVersion: openworld/v1alpha1
kind: WorldPackage
metadata:
  namespace: openworld-examples
  name: mobile-manipulation-world
  version: 0.1.0
  title: Mobile Manipulation World
  license: Apache-2.0
spec:
  domains:
  - physical-ai
  - robotics
  - manipulation
  world:
    description: WORLD.md
    definition: A reusable semantic and interface contract for a mobile manipulation
      task world.
    boundary:
      included:
      - robot
      - object
      - workspace
      - target
      - observation
      - action
      - constraint
      - outcome
      excluded:
      - specific_robot_firmware
      - specific_simulator_runtime
    defaultView: views/pick-place-task.yaml
    defaultStateCompiler: state/pick-place-compiler.yaml
  conformance:
    profile: action-ready
  capabilities:
  - explore
  - simulation_ready
  - action_contract
  validity:
    limitations:
    - Reference semantics and interfaces only.
  assets:
  - kind: WorldViewProfile
    path: views/pick-place-task.yaml
  - kind: StateCompilerProfile
    path: state/pick-place-compiler.yaml
  - kind: ObservationAcquisitionProfile
    path: interfaces/observations.yaml
  - kind: ActionBindingProfile
    path: interfaces/actions.yaml
  - kind: CommitContract
    path: interfaces/commit.yaml
  - kind: EffectVerificationProfile
    path: interfaces/effect-verification.yaml
  - kind: EnvironmentProfile
    path: environment/reference-environment.yaml
  - kind: Dataset
    path: datasets/manipulation-episodes.yaml
  - kind: ScenarioProfile
    path: scenarios/pick-place.yaml
  - kind: PackageExample
    path: examples/basic.yaml
  - kind: PackageExample
    path: examples/observations.yaml
  - kind: PackageExample
    path: examples/expected-ews.yaml
