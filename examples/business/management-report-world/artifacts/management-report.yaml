apiVersion: openworld/v1alpha1
kind: ArtifactContract
metadata:
  name: management-report
spec:
  artifact: {type: report, representation: document}
  structure:
    required: [executive_summary, kpi_table, variance_explanations, open_risks, initiative_status, outlook]
    optional: [appendix]
  serialization: {formats: [pdf, docx, markdown]}
  governance: {approvalRequired: true}
