apiVersion: openworld/v1alpha1
kind: SemanticBinding
metadata: {name: terms}
spec:
  terms: {claim: q:Claim, lot: q:Lot}
  fields:
    claim.status:
      class: q:Claim
      path: [q:claimStatus]
      values:
        scheme: q:ClaimStatuses
        base: "https://example.org/quality/claim-status/"
        map: {"on hold": q:ClaimOnHold}
    lot.genealogy: {class: q:Lot, path: [q:derivedFrom]}
  observationTypes: {QMS.claim: q:Claim}
  actions: {propose_capa: q:ProposeCapa}
  semanticIds:
    fields:
      claim.status: ["0173-1#02-AAO677#002", "https://example.org/dictionary/claim-status"]
    terms:
      lot: ["0112/2///61360_4#AAE530#002"]
