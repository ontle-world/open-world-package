apiVersion: openworld/v1alpha1
kind: WorldViewProfile
metadata:
  name: default-view
spec:
  purpose:
    task: enterprise_task
    actorScope: any
    objective: task_defined
  projection:
    include:
    - organization
    - work
    - decisions
    - actions
    - outcomes
    principle: minimal_sufficient_representation
  conditioning:
    authorityScope: task_declared
    timeScope: task_declared
    scale: task_declared
    resolution: task_declared
