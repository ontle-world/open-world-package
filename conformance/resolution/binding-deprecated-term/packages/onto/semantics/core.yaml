apiVersion: openworld/v1alpha1
kind: SemanticProfile
metadata: {name: core}
spec:
  types:
  - id: q:Claim
    properties:
    - {id: q:claimStatus}
  - id: q:Lot
    properties:
    - {id: q:derivedFrom, range: q:Lot, status: deprecated, replacedBy: q:madeFrom}
    - {id: q:madeFrom, range: q:Lot}
  - id: q:ProposeCapa
