apiVersion: openworld/v1alpha1
kind: ScenarioProfile
metadata: {name: quality-hold}
spec:
  objective: decide_whether_to_hold_lots
  baselineStateRef: examples/expected-ews.yaml
  assumptions: [defect_rate_constant_without_hold]
  intervention: {action: request_quality_hold, lots: [L-1, L-2]}
  engine: {kind: world_model}
  timeHorizon: P14D
  constraints: [delivery_commitments]
  uncertainty: {escapedDefects: {low: 0, high: 3}}
  confidence: 0.7
  expectedOutcome: {escapedDefects: 0, deliveryDelayDays: 2}
