apiVersion: openworld/v1alpha1
kind: ConsumerRepresentationProfile
metadata:
  name: report-agent
spec:
  actor: {kind: agent, ref: actors/report-agent.yaml}
  worldViewRef: views/report-agent.yaml
  representation:
    mode: structured_context
    freshness: {maxAge: P1D}
    provenance: required
  agent:
    toolScope: {capabilityRefs: [capabilities/bi-read.yaml]}
    memoryScope: {retention: task}
    feasibleActions: [draft_report]
    contextBudget: {maxItems: 200}
