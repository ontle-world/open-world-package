[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ontle-open-world"
version = "0.2.0a2"
description = "Reference CLI and tooling for Open World Packages (OWP)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "FutureWorkLab"}]
dependencies = ["PyYAML>=6.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.scripts]
ontle = "ontle.cli:main"

[tool.setuptools]
# vocab/ is a specification artifact at the repository root; it ships as ontle.vocab.
package-dir = {"" = "src", "ontle.vocab" = "vocab"}
packages = ["ontle", "ontle.vocab"]
include-package-data = true

[tool.setuptools.package-data]
ontle = ["templates/**/*"]
"ontle.vocab" = ["*.yaml"]
