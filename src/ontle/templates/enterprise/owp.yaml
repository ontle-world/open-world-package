apiVersion: openworld/v1alpha1
kind: WorldPackage
metadata:
  namespace: example
  name: enterprise-world
  version: 0.1.0
  title: Enterprise World
  license: Apache-2.0
spec:
  domains:
  - enterprise
  world:
    description: WORLD.md
    definition: A task-ready enterprise representation that can bind native systems
      through explicit interfaces.
    boundary:
      included:
      - organization
      - work
      - decisions
      - actions
      - outcomes
      excluded:
      - complete-copy-of-all-enterprise-data
    defaultView: views/default.yaml
    defaultStateCompiler: state/default-compiler.yaml
  conformance:
    profile: stateful
  capabilities:
  - explore
  - state_tracking
  validity:
    limitations: []
  assets:
  - kind: WorldViewProfile
    path: views/default.yaml
  - kind: StateCompilerProfile
    path: state/default-compiler.yaml
  - kind: SourceSystemSchemaProfile
    path: interfaces/sources.yaml
  - kind: ObservationAcquisitionProfile
    path: interfaces/observations.yaml
  - kind: ActionBindingProfile
    path: interfaces/actions.yaml
  - kind: CommitContract
    path: interfaces/commit.yaml
  - kind: EffectVerificationProfile
    path: interfaces/effect-verification.yaml
  - kind: PackageExample
    path: examples/basic.yaml
