apiVersion: openworld/v1alpha1
kind: WorldViewProfile
metadata:
  description: "Raw image/video frames remain observation artifacts; the view selects task-relevant semantic and observation state."
  name: pick-place-task-view
spec:
  purpose:
    task: pick_place
    actorScope: robot_or_authorized_controller
    objective: place_target_object_safely
  projection:
    include:
    - robot
    - target_object
    - target_zone
    - task
    - workspace
    - observations
    - safety_constraints
    - action_space
    - task_outcome
    principle: minimal_sufficient_representation
    timeScope: task_declared
    scale: task_declared
    resolution: task_declared
  conditioning:
    authorityScope: task_declared
