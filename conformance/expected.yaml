# Expected outcomes for the OWP conformance suite.
# valid: whether a conforming validator accepts the package.
# satisfiedProfile: highest WorldPackage conformance profile satisfied (WorldPackage cases only; null if none).
# rule: informative; error message wording is implementation-defined.
suite: owp-conformance/v1alpha1
cases:
  world-descriptive-default:
    valid: true
    satisfiedProfile: descriptive
    rule: "Absent spec.conformance means descriptive; no View or State Compiler is required."
  world-descriptive-missing-definition:
    valid: false
    errors: [profile.descriptive]
    satisfiedProfile: null
    rule: "descriptive requires spec.world.definition."
  world-viewable:
    valid: true
    satisfiedProfile: viewable
    rule: "viewable requires a WorldViewProfile named by spec.world.defaultView."
  world-viewable-missing-default-view:
    valid: false
    errors: [profile.viewable]
    satisfiedProfile: descriptive
    rule: "viewable requires spec.world.defaultView."
  world-stateful-satisfies-higher:
    valid: true
    satisfiedProfile: model-ready
    rule: "The satisfied profile is computed independently of the declared profile."
  world-stateful-missing-compiler:
    valid: false
    errors: [profile.stateful]
    satisfiedProfile: viewable
    rule: "stateful requires a StateCompilerProfile named by spec.world.defaultStateCompiler."
  world-compiler-unknown-view:
    valid: false
    errors: [profile.stateful.compiler-view]
    satisfiedProfile: viewable
    rule: "A StateCompilerProfile spec.worldViewRef must point to a local WorldViewProfile asset."
  world-compiler-wrong-output-contract:
    valid: false
    errors: [profile.stateful.output-contract]
    satisfiedProfile: viewable
    rule: "A StateCompilerProfile must declare outputContract = EffectiveWorldState."
  world-model-ready-missing-schema:
    valid: false
    errors: [profile.model-ready.output-schema]
    satisfiedProfile: stateful
    rule: "model-ready requires a concrete EWS schema: outputSchema.fields or outputSchemaRef."
  world-action-ready:
    valid: true
    satisfiedProfile: action-ready
    rule: "action-ready = model-ready + ActionBinding + Commit + EffectVerification."
  world-action-ready-missing-commit:
    valid: false
    errors: [profile.action-ready]
    satisfiedProfile: model-ready
    rule: "action-ready requires a CommitContract."
  world-unknown-profile:
    valid: false
    errors: [profile.unknown]
    satisfiedProfile: descriptive
    rule: "spec.conformance.profile must be a defined profile."
  world-model-ready-via-schema-ref:
    valid: true
    satisfiedProfile: model-ready
    rule: "model-ready may be satisfied by outputSchemaRef."
  compiler-output-schema-ref-missing-file:
    valid: false
    errors: [compiler.output-schema-ref, profile.model-ready.output-schema]
    satisfiedProfile: stateful
    rule: "outputSchemaRef must name a JSON Schema file in the package; an unresolvable reference gives no EWS fields."
  compiler-output-schema-ref-missing-bindings:
    valid: false
    errors: [compiler.output-schema-ref, profile.model-ready.output-schema]
    satisfiedProfile: stateful
    rule: "When outputSchemaRef does not resolve, its fields are unknown and binding keys are not checked against them, so stateful still holds."
  compiler-output-schema-ref-no-properties:
    valid: false
    errors: [compiler.output-schema-ref, profile.model-ready.output-schema]
    satisfiedProfile: stateful
    rule: "The JSON Schema named by outputSchemaRef must have a non-empty top-level properties object."
  compiler-output-schema-mismatch:
    valid: false
    errors: [compiler.output-schema-mismatch]
    satisfiedProfile: model-ready
    rule: "When a compiler declares both, outputSchema.fields and the properties of outputSchemaRef list the same fields."
  compiler-output-schema-ref-null:
    valid: true
    satisfiedProfile: model-ready
    rule: "outputSchemaRef: null (an empty value) counts as absent, like other optional fields."
  compiler-output-schema-ref-not-json:
    valid: false
    errors: [compiler.output-schema-ref, profile.model-ready.output-schema]
    satisfiedProfile: stateful
    rule: "NaN is not JSON, so the schema named by outputSchemaRef does not resolve (spec section 12.1)."
  compiler-output-schema-ref-not-utf8:
    valid: false
    errors: [compiler.output-schema-ref, profile.model-ready.output-schema]
    satisfiedProfile: stateful
    rule: "The schema named by outputSchemaRef is UTF-8; invalid bytes do not resolve (spec section 12.1)."
  package-legacy-manifest:
    valid: false
    errors: [package.legacy-manifest]
    satisfiedProfile: descriptive
    rule: "package.yaml or world.yaml at the package root is rejected."
  asset-missing-file:
    valid: false
    errors: [asset.missing-file]
    satisfiedProfile: descriptive
    rule: "A listed PackageExample path must exist."
  asset-path-escapes-package:
    valid: false
    errors: [asset.path-escape]
    satisfiedProfile: descriptive
    rule: "A listed PackageExample path must stay inside the package."
  world-bad-binding-field:
    valid: false
    errors: [compiler.binding]
    satisfiedProfile: viewable
    rule: "A binding key must be a field of outputSchema.fields; malformed bindings fail stateful (declared and satisfied)."
  world-bad-binding-select:
    valid: false
    errors: [compiler.binding]
    satisfiedProfile: viewable
    rule: "Binding select must be latest or all."
  dependency-range:
    valid: false
    errors: [manifest.dependency]
    satisfiedProfile: descriptive
    rule: "Dependencies are exact references; ranges are invalid even without resolution."
  identity-with-slash:
    valid: false
    errors: [manifest.identity]
    satisfiedProfile: descriptive
    rule: "namespace and name must not contain '/', '@', '#', or whitespace."
  package-legacy-world-yaml:
    valid: false
    errors: [package.legacy-manifest]
    satisfiedProfile: descriptive
    rule: "world.yaml at the package root is rejected."
  asset-duplicate-path:
    valid: false
    errors: [asset.duplicate-path]
    satisfiedProfile: descriptive
    rule: "A PackageExample path is listed at most once."
  asset-dotslash-path:
    valid: false
    errors: [asset.path-form]
    satisfiedProfile: descriptive
    rule: "A PackageExample path is a relative POSIX path without a leading ./."
  extension-kind-declared:
    valid: true
    satisfiedProfile: descriptive
    rule: "An extension asset kind <name>:<Kind> is accepted when spec.dependencies declares <name> with 'as'."
  extension-kind-undeclared:
    valid: false
    errors: [extension.undeclared]
    satisfiedProfile: descriptive
    rule: "An extension asset kind whose extension name is not declared is an error."
  extension-kind-malformed:
    valid: false
    errors: [asset.kind]
    satisfiedProfile: descriptive
    rule: "A kind containing ':' must have the form <extension>:<Kind>."
  extension-blocks:
    valid: true
    satisfiedProfile: descriptive
    rule: "extensions blocks are allowed in manifest objects, asset entries, and asset metadata/spec; keys are declared extension names."
  extension-block-undeclared:
    valid: false
    errors: [extension.undeclared]
    satisfiedProfile: descriptive
    rule: "An extensions block key must be a declared extension name."
  extension-block-asset-undeclared:
    valid: false
    errors: [extension.undeclared]
    satisfiedProfile: descriptive
    rule: "Extension names in local asset documents are checked against the package's declarations."
  extension-block-not-mapping:
    valid: false
    errors: [extension.block]
    satisfiedProfile: descriptive
    rule: "An extensions block maps each extension name to a mapping."
  extension-name-reserved:
    valid: false
    errors: [extension.name]
    satisfiedProfile: descriptive
    rule: "owp and openworld are reserved extension names."
  extension-name-form:
    valid: false
    errors: [extension.name]
    satisfiedProfile: descriptive
    rule: "Extension names match [a-z][a-z0-9-]*."
  extension-duplicate:
    valid: false
    errors: [extension.duplicate]
    satisfiedProfile: descriptive
    rule: "An extension name is declared at most once."
  extension-must-understand:
    valid: true
    satisfiedProfile: descriptive
    rule: "mustUnderstand: true is valid on a dependency declared with 'as'."
  extension-must-understand-without-as:
    valid: false
    errors: [extension.declaration]
    satisfiedProfile: descriptive
    rule: "mustUnderstand requires 'as'."
  extension-name-not-string:
    valid: false
    errors: [extension.name]
    satisfiedProfile: descriptive
    rule: "When as is present it must be a valid extension name; as: null is invalid."
  package-example-extensions:
    valid: true
    satisfiedProfile: descriptive
    rule: "PackageExample files may hold any document, so their extensions blocks are not checked against declarations."
  manifest-unknown-field:
    valid: false
    errors: [schema.unknown-field]
    satisfiedProfile: descriptive
    rule: "A key that is neither a defined field nor an extensions block is an error (here a misspelt defaultView)."
  manifest-unknown-metadata-field:
    valid: false
    errors: [schema.unknown-field]
    satisfiedProfile: descriptive
    rule: "metadata accepts only its defined fields and an extensions block."
  manifest-colon-field:
    valid: false
    errors: [schema.unknown-field]
    satisfiedProfile: descriptive
    rule: "Extension data goes in an extensions block; a field named <extension>:<field> is unknown."
  manifest-open-containers:
    valid: true
    satisfiedProfile: descriptive
    rule: "Keys inside open containers such as spec.validity are not checked."
  extension-definition:
    valid: true
    rule: "spec.extensionDefinition lists the kinds and schema files an extension package defines."
  extension-definition-malformed:
    valid: false
    errors: [extension.definition]
    rule: "extensionDefinition.kinds are PascalCase names without a prefix."
  extension-definition-missing-schema:
    valid: false
    errors: [extension.definition]
    rule: "extensionDefinition.schemas entries must exist in the package."
  evidence-unknown-field:
    valid: false
    errors: [schema.unknown-field]
    rule: "CompatibilityEvidence accepts only the fields of schemas/compatibility-evidence.schema.json and extensions blocks."
  package-example-kind-not-checked:
    valid: true
    satisfiedProfile: descriptive
    rule: "A PackageExample may hold any document, such as an ObservationSet; its kind is not compared with the manifest kind."
  package-example-unparseable:
    valid: false
    errors: [asset.yaml]
    satisfiedProfile: descriptive
    rule: "A PackageExample YAML file must still parse."
  manifest-bad-api-version:
    valid: false
    errors: [manifest.api-version]
    satisfiedProfile: descriptive
    rule: "apiVersion must be openworld/v1alpha1."
  manifest-duplicate-key:
    valid: false
    errors: [manifest.load]
    rule: "A mapping with two equal keys does not parse (spec section 5.2)."
  manifest-yaml-core-scalars:
    valid: true
    satisfiedProfile: descriptive
    rule: "Plain scalars follow the YAML 1.2 core schema (spec section 5.2): `on` and `1:20` are strings, not true and 80."
  manifest-unknown-kind:
    valid: false
    errors: [manifest.kind]
    rule: "kind must be a defined package kind."
  package-missing-card:
    valid: false
    errors: [package.card]
    satisfiedProfile: descriptive
    rule: "A WorldPackage requires WORLD.md."
  asset-path-and-ref:
    valid: false
    errors: [asset.path-or-ref]
    satisfiedProfile: descriptive
    rule: "An asset entry declares exactly one of path or ref."
  asset-unparseable-yaml:
    valid: false
    errors: [asset.yaml]
    satisfiedProfile: descriptive
    rule: "Local YAML assets other than PackageExample must parse."
  asset-duplicate-key:
    valid: false
    errors: [asset.yaml]
    satisfiedProfile: descriptive
    rule: "A mapping with two equal keys does not parse (spec section 5.2)."
  asset-non-string-key:
    valid: false
    errors: [asset.yaml]
    satisfiedProfile: descriptive
    rule: "Mapping keys are strings (spec section 5.2); the plain key 1 reads as a number."
  world-default-compiler-other-view:
    valid: false
    errors: [profile.stateful.default-compiler-view]
    satisfiedProfile: viewable
    rule: "The default State Compiler must compile spec.world.defaultView."
  ontology-missing-spec:
    valid: false
    errors: [ontology.spec]
    rule: "An OntologyPackage declares spec.ontology as a mapping."
  model-grounded:
    valid: true
    rule: "A World Model names compatible World Views and State Compilers as <worldRef>#<asset path>."
  model-grounding-dotslash-path:
    valid: false
    errors: [worldmodel.grounding-ref]
    rule: "The <asset path> of a grounding reference is a relative POSIX path in normal form, without a leading ./ (spec section 3)."
  model-missing-views:
    valid: false
    errors: [worldmodel.compatible-views]
    rule: "compatibleWorldViews is required."
  model-missing-compilers:
    valid: false
    errors: [worldmodel.compatible-compilers]
    rule: "compatibleStateCompilers is required."
  model-view-other-world:
    valid: false
    errors: [worldmodel.grounding-ref]
    rule: "Grounding references must belong to semanticGrounding.worldRef."
  evidence-pinned:
    valid: true
    rule: "Evidence binds an exact EvaluationProfile version and a scope inside the declared applicability."
  evidence-unpinned-profile:
    valid: false
    errors: [evidence.unpinned]
    rule: "Evidence must reference <name>@<exact-semver>; ranges are not allowed."
  evidence-version-mismatch:
    valid: false
    errors: [evidence.version-mismatch]
    rule: "Evidence cannot claim a version other than the packaged EvaluationProfile version."
  evidence-view-out-of-scope:
    valid: false
    errors: [evidence.scope.world-view]
    rule: "Evidence scope.worldView must be one of compatibleWorldViews."
  evidence-compiler-out-of-scope:
    valid: false
    errors: [evidence.scope.state-compiler]
    rule: "Evidence scope.stateCompiler, when present, must be one of compatibleStateCompilers."
  evidence-subject-mismatch:
    valid: false
    errors: [evidence.subject]
    rule: "Inside a WorldModelPackage, evidence subject is the package identity."
  evidence-scope-worldref-mismatch:
    valid: false
    errors: [evidence.scope.world-ref]
    rule: "Evidence scope.worldRef equals semanticGrounding.worldRef."
  evidence-external-profile:
    valid: true
    rule: "Evidence may bind an EvaluationProfile that is not packaged locally."
  evidence-local-profile-unversioned:
    valid: false
    errors: [evidence.version-mismatch]
    rule: "Binding to a locally packaged EvaluationProfile requires that profile to declare the same metadata.version."
  evidence-verifier-version-mismatch:
    valid: false
    errors: [evidence.version-mismatch]
    rule: "A pinned verifier that is packaged locally must match its version."
  model-wrong-input-contract:
    valid: false
    errors: [worldmodel.input-contract]
    rule: "inputs.contract must be EffectiveWorldState."
  model-missing-adapter:
    valid: false
    errors: [worldmodel.adapter, worldmodel.adapter-ref]
    rule: "A WorldModelPackage needs a RepresentationAdapterProfile asset; no file in the package declares one."
  model-world-ref-not-package-reference:
    valid: false
    errors: [worldmodel.world-ref]
    rule: "semanticGrounding.worldRef must be <namespace>/<name>@<semver>."
  eval-duplicate-name:
    valid: false
    errors: [eval.duplicate-name]
    rule: "Two local EvaluationProfiles must not share metadata.name."
  model-adapter-wrong-source:
    valid: false
    errors: [worldmodel.adapter-source]
    rule: "The adapter named by adapterRef must declare spec.source = EffectiveWorldState."
  model-no-roles:
    valid: false
    errors: [worldmodel.roles]
    rule: "A World Model declares at least one role."
  eval-bad-version:
    valid: false
    errors: [eval.version]
    rule: "EvaluationProfile metadata.version, when present, is SemVer."
  eval-supersedes-range:
    valid: false
    errors: [eval.supersedes]
    rule: "supersedes is a pinned <name>@<version> reference."
  evidence-missing-result:
    valid: false
    errors: [evidence.result]
    rule: "CompatibilityEvidence declares spec.result."
  evidence-unpinned-verifier:
    valid: false
    errors: [evidence.unpinned]
    rule: "A verifier reference, when present, must be pinned."

# Resolution cases: validate <case>/root with dependency resolution, using <case>/packages as the only package source.
  ref-pinned-commit:
    valid: true
    satisfiedProfile: descriptive
    rule: "A Hugging Face or git reference is pinned by a commit-hash revision."
  ref-status-null:
    valid: true
    satisfiedProfile: descriptive
    rule: "status: null counts as absent, so the reference is bound (spec section 5.1)."
  ref-oci-digest:
    valid: true
    satisfiedProfile: descriptive
    rule: "An OCI reference is pinned by the manifest digest."
  ref-filelist:
    valid: true
    satisfiedProfile: descriptive
    rule: "Several files are pinned through a file list (application/vnd.openworld.filelist+json) and its digest."
  ref-unbound:
    valid: true
    satisfiedProfile: descriptive
    rule: "status: unbound records that no artifact is chosen yet; other fields are optional."
  ref-unpinned:
    valid: true
    satisfiedProfile: descriptive
    rule: "An unpinned bound reference is a warning (ref.unpinned), not an error."
  standard-binding-valid:
    valid: true
    satisfiedProfile: descriptive
    rule: "spec.standardBindings maps names to {standard, ref, license, terms}; a binding may map names to terms, leave its ref unbound, or bind a pinned, licensed artifact (spec section 5.3)."
  standard-binding-unpinned:
    valid: false
    errors: [standard.unpinned]
    satisfiedProfile: descriptive
    rule: "A bound reference in a standard binding must be pinned; a branch name is not a commit hash."
  standard-binding-unlicensed:
    valid: false
    errors: [standard.license]
    satisfiedProfile: descriptive
    rule: "A standard binding that binds an artifact declares its license."
  standard-binding-license-null:
    valid: false
    errors: [standard.license]
    satisfiedProfile: descriptive
    rule: "license: null counts as absent, so a bound artifact without a license value is standard.license."
  standard-binding-shape:
    valid: false
    errors: [standard.binding, schema.unknown-field]
    satisfiedProfile: descriptive
    rule: "A standard binding names its standard; keys outside standard, ref, license, terms, and extensions are errors."
  ref-missing-uri:
    valid: false
    errors: [ref.shape]
    satisfiedProfile: descriptive
    rule: "A bound reference declares provider and uri."
  ref-bad-digest:
    valid: false
    errors: [ref.shape]
    satisfiedProfile: descriptive
    rule: "digest is sha256: followed by 64 lowercase hex digits."
  ref-bad-status:
    valid: false
    errors: [ref.shape]
    satisfiedProfile: descriptive
    rule: "status is bound or unbound."
  ref-unknown-provider:
    valid: false
    errors: [ref.provider]
    satisfiedProfile: descriptive
    rule: "provider is a listed provider or <extension>:<provider>."
  ref-extension-provider:
    valid: true
    satisfiedProfile: descriptive
    rule: "An extension provider is accepted when its extension is declared."
  ref-extension-provider-undeclared:
    valid: false
    errors: [extension.undeclared]
    satisfiedProfile: descriptive
    rule: "An extension provider must use a declared extension name."
  ref-unknown-field:
    valid: false
    errors: [schema.unknown-field]
    satisfiedProfile: descriptive
    rule: "ExternalRef accepts only its defined fields and an extensions block."
  experimental-kinds:
    valid: true
    satisfiedProfile: viewable
    warnings: [asset.kind-experimental]
    rule: "Experimental kinds (spec Appendix C) are valid and reported with asset.kind-experimental."
  experimental-unknown-field:
    valid: true
    satisfiedProfile: viewable
    warnings: [experimental.field]
    rule: "An undefined field in an experimental kind is a warning, not an error."
  experimental-value-unknown:
    valid: true
    satisfiedProfile: viewable
    warnings: [experimental.value]
    rule: "A value outside an experimental value set is a warning."
  experimental-reference-wrong-kind:
    valid: true
    satisfiedProfile: viewable
    warnings: [experimental.reference]
    rule: "An experimental reference must name a local asset of the expected kind; otherwise a warning."
  experimental-actor-block-mismatch:
    valid: true
    satisfiedProfile: viewable
    warnings: [experimental.field]
    rule: "A ConsumerRepresentationProfile carries only the block named by actor.kind."
  experimental-extension-value:
    valid: true
    satisfiedProfile: viewable
    rule: "An extension value <extension>:<value> is accepted in an experimental value set when the extension is declared."
  experimental-extension-value-undeclared:
    valid: false
    errors: [extension.undeclared]
    satisfiedProfile: viewable
    rule: "Extension rules stay errors inside experimental kinds."
  view-specializes:
    valid: true
    satisfiedProfile: viewable
    rule: "A World View may specialize another local World View (experimental fields)."
  view-specializes-cycle:
    valid: true
    satisfiedProfile: viewable
    warnings: [experimental.reference]
    rule: "A specializes cycle is a warning."
  view-specializes-missing:
    valid: true
    satisfiedProfile: viewable
    warnings: [experimental.reference]
    rule: "specializes must name a local WorldViewProfile; otherwise a warning."
  ontology-no-profile:
    valid: true
    rule: "Without spec.conformance no ontology profile is required."
  ontology-vocabulary:
    valid: true
    satisfiedProfile: schema
    rule: "vocabulary requires iri and at least one entrypoint."
  ontology-schema-owp-yaml:
    valid: true
    satisfiedProfile: schema
    rule: "schema is satisfied by an owp-yaml schema entrypoint."
  ontology-schema-rdf-with-index:
    valid: true
    satisfiedProfile: schema
    rule: "An RDF schema entrypoint satisfies schema together with a termIndex; RDF content is not parsed for validity."
  ontology-schema-rdf-without-index:
    valid: false
    errors: [profile.ontology.schema]
    satisfiedProfile: vocabulary
    rule: "A schema without an owp-yaml entrypoint requires termIndex."
  ontology-constrained-missing-shapes:
    valid: false
    errors: [profile.ontology.constrained]
    satisfiedProfile: schema
    rule: "constrained requires an entrypoint with role shapes."
  ontology-mapped:
    valid: true
    satisfiedProfile: mapped
    rule: "mapped requires shapes and mappings entrypoints."
  ontology-missing-iri:
    valid: false
    errors: [profile.ontology.vocabulary]
    rule: "vocabulary requires spec.ontology.iri."
  ontology-bad-iri:
    valid: false
    errors: [ontology.iri]
    rule: "iri must be an absolute IRI."
  ontology-bad-prefix:
    valid: false
    errors: [ontology.prefix]
    rule: "prefix values must be absolute IRIs."
  ontology-entrypoint-missing-file:
    valid: false
    errors: [ontology.entrypoint]
    rule: "An entrypoint path must exist in the package."
  ontology-unknown-format:
    valid: false
    errors: [ontology.format]
    rule: "An entrypoint format must be one of the listed formats."
  ontology-prefix-undeclared:
    valid: false
    errors: [ontology.prefix-undeclared]
    rule: "SemanticProfile identifiers use prefixes declared in spec.ontology.prefixes."
  ontology-owp-yaml-not-semantic-profile:
    valid: false
    errors: [ontology.parse]
    rule: "An owp-yaml entrypoint must be a SemanticProfile document."
  ontology-term-index-malformed:
    valid: false
    errors: [ontology.term-index]
    rule: "Term index entries need an absolute iri and a known type."
  ontology-external-import:
    valid: true
    rule: "externalImports entries name an IRI and a pinned ExternalRef."
  ontology-external-import-missing-ref:
    valid: false
    errors: [ontology.external-import]
    rule: "An externalImports entry needs a ref."
  ontology-unknown-field:
    valid: false
    errors: [schema.unknown-field]
    rule: "spec.ontology accepts only its defined fields (the old formats key is unknown)."
  ontology-profile-unknown:
    valid: false
    errors: [profile.unknown]
    rule: "An OntologyPackage profile must be an ontology profile."
  ontology-semantic-profile-unknown-field:
    valid: false
    errors: [schema.unknown-field]
    rule: "SemanticProfile documents accept only their defined fields."
  ontology-entrypoint-escape:
    valid: false
    errors: [ontology.entrypoint]
    rule: "Entrypoint paths name files inside the package; a path that resolves outside is rejected even if the file exists."
  binding-valid:
    valid: true
    satisfiedProfile: model-ready
    rule: "A SemanticBinding binds World names, EWS fields, observation types, and actions to CURIEs."
  binding-asset-missing:
    valid: false
    errors: [binding.asset]
    satisfiedProfile: model-ready
    rule: "spec.world.semanticBinding must name a local SemanticBinding asset; a file without an OWP apiVersion is not an asset."
  binding-not-curie:
    valid: false
    errors: [binding.curie]
    satisfiedProfile: model-ready
    rule: "Binding values are CURIEs."
  binding-field-unknown:
    valid: false
    errors: [binding.field-unknown]
    satisfiedProfile: model-ready
    rule: "A bound field must be in some local State Compiler outputSchema.fields."
  binding-term-unscoped:
    valid: true
    satisfiedProfile: model-ready
    warnings: [binding.term-unscoped]
    rule: "A term outside the World boundary and every View projection is a warning."
  binding-unknown-field:
    valid: false
    errors: [schema.unknown-field]
    satisfiedProfile: model-ready
    rule: "SemanticBinding documents accept only their defined fields."
  binding-field-shape:
    valid: false
    errors: [schema.unknown-field]
    satisfiedProfile: model-ready
    rule: "A fields entry has class and path only."
  extraction-profile:
    valid: true
    satisfiedProfile: model-ready
    warnings: [asset.kind-experimental]
    rule: "A KnowledgeExtractionProfile over a local KnowledgeAsset is valid; multi-valued types are read with select: all."
  extraction-multi-latest:
    valid: true
    satisfiedProfile: model-ready
    warnings: [compiler.multi-latest]
    rule: "Reading a multi-valued extracted type with select: latest is a warning."
  artifact-contract-full:
    valid: true
    satisfiedProfile: viewable
    warnings: [asset.kind-experimental]
    rule: "ArtifactContract keeps type, representation, format, and storage apart and lists allowed operations."
  artifact-operation-unknown:
    valid: true
    satisfiedProfile: viewable
    warnings: [experimental.value]
    rule: "allowedOperations come from the value set artifactOperations."
  artifact-supersedes-unpinned:
    valid: true
    satisfiedProfile: viewable
    warnings: [experimental.field]
    rule: "supersedes is a pinned <name>@<version> reference."
  work-pattern-graph:
    valid: true
    satisfiedProfile: viewable
    warnings: [asset.kind-experimental]
    rule: "A work pattern graph of nodes, transitions, guards, events, and loops."
  work-pattern-graph-dangling:
    valid: true
    satisfiedProfile: viewable
    warnings: [experimental.reference]
    rule: "Transitions refer to declared nodes."
  work-pattern-graph-duplicate-node:
    valid: true
    satisfiedProfile: viewable
    warnings: [experimental.field]
    rule: "Node ids are unique."
  work-pattern-node-family-unknown:
    valid: true
    satisfiedProfile: viewable
    warnings: [experimental.value]
    rule: "Node families come from the value set workNodeFamilies."
  work-pattern-loop-bound:
    valid: true
    satisfiedProfile: viewable
    warnings: [experimental.field]
    rule: "maxIterations is a positive integer."
  actor-role-delegation:
    valid: true
    satisfiedProfile: viewable
    warnings: [asset.kind-experimental]
    rule: "Actors occupy roles that grant permissions and authority; a delegation stays within the delegator's grants."
  actor-type-unknown:
    valid: true
    satisfiedProfile: viewable
    warnings: [experimental.value]
    rule: "actorType comes from the value set actorTypes; persona is not an actor type."
  delegation-exceeds-authority:
    valid: true
    satisfiedProfile: viewable
    warnings: [experimental.delegation-exceeds-authority]
    rule: "A delegation cannot grant actions or decisions the delegator's roles do not hold."
  delegation-bad-period:
    valid: true
    satisfiedProfile: viewable
    warnings: [experimental.field]
    rule: "validFrom is before expiresAt."
  consumer-actor-ref:
    valid: true
    satisfiedProfile: viewable
    warnings: [experimental.reference]
    rule: "ConsumerRepresentationProfile actor.ref names an ActorProfile."
  world-view-portable:
    valid: true
    satisfiedProfile: viewable
    rule: "A World View may name the actor, role, and task it serves, its constraints, and evidence (C.4)."
  world-view-unknown-field:
    valid: false
    errors: [schema.unknown-field]
    rule: "WorldViewProfile accepts only its defined fields."
  world-view-actor-ref-wrong-kind:
    valid: true
    warnings: [experimental.reference]
    satisfiedProfile: viewable
    rule: "purpose.actorRef names a local ActorProfile."
  evaluation-profile-portable:
    valid: true
    satisfiedProfile: viewable
    rule: "An EvaluationProfile may state its assessment kind, subject, criteria, verifier, and evaluator (C.4)."
  evaluation-assessment-kind-unknown:
    valid: false
    errors: [evaluation.assessment-kind]
    satisfiedProfile: viewable
    rule: "assessmentKind must come from the value set assessmentKinds (spec section 15.1)."
  evaluation-unknown-field:
    valid: false
    errors: [schema.unknown-field]
    satisfiedProfile: viewable
    rule: "EvaluationProfile accepts only its defined fields."
  scenario-portable:
    valid: true
    satisfiedProfile: viewable
    rule: "A ScenarioProfile is a baseline, assumptions, an intervention, and an engine (C.4)."
  scenario-engine-unknown:
    valid: false
    errors: [scenario.engine-kind]
    satisfiedProfile: viewable
    rule: "engine.kind must come from the value set scenarioEngines (spec section 15.2)."
  scenario-confidence-range:
    valid: false
    errors: [scenario.confidence]
    satisfiedProfile: viewable
    rule: "confidence must be a number from 0 to 1 (spec section 15.2)."
  capability-minimal:
    valid: true
    satisfiedProfile: viewable
    rule: "A CapabilityContract may state outcomes, context, inputs, capacity, and maturity (C.4)."
  capability-unknown-field:
    valid: false
    errors: [schema.unknown-field]
    satisfiedProfile: viewable
    rule: "CapabilityContract accepts only its defined fields; scoring models are not part of it."
  task-set-composition:
    valid: true
    warnings: [asset.kind-experimental]
    satisfiedProfile: viewable
    rule: "A TaskSet composes actors, work patterns, and scenarios with its Views (C.4)."
  task-set-composition-wrong-kind:
    valid: true
    warnings: [experimental.reference]
    satisfiedProfile: viewable
    rule: "workPatternRefs name local WorkPatternProfiles."
  evaluation-verifier-ref-unpinned:
    valid: false
    errors: [evaluation.verifier-ref]
    satisfiedProfile: viewable
    rule: "verifierRef is a local VerifierProfile or a pinned <name>@<version> (spec section 15.1)."
  evaluation-subject-missing:
    valid: false
    errors: [evaluation.subject]
    satisfiedProfile: viewable
    rule: "subject.ref names a listed local asset or a package/asset reference."
  evaluation-result-schema-missing:
    valid: false
    errors: [evaluation.result-schema]
    satisfiedProfile: viewable
    rule: "resultSchemaRef is a file in the package."
  scenario-baseline-missing:
    valid: false
    errors: [scenario.baseline-ref]
    satisfiedProfile: viewable
    rule: "baselineStateRef is a file in the package or a URI (spec section 15.2)."
  asset-header-omitted:
    valid: true
    satisfiedProfile: descriptive
    rule: "A YAML file without an OWP apiVersion is an ordinary package file, not an asset (spec section 5)."
  asset-without-api-version:
    valid: false
    errors: [profile.viewable]
    satisfiedProfile: descriptive
    rule: "A View file without an OWP apiVersion is not an asset, so defaultView does not name a local WorldViewProfile."
  asset-local-path-listed:
    valid: false
    errors: [asset.path-or-ref]
    satisfiedProfile: descriptive
    rule: "spec.assets lists external references and PackageExample files; a local asset is found by its own apiVersion and kind."
  asset-unknown-kind:
    valid: false
    errors: [asset.kind]
    satisfiedProfile: descriptive
    rule: "A file with an OWP apiVersion names an asset kind of the vocabulary, a document kind, or an extension kind."
  asset-missing-kind:
    valid: false
    errors: [asset.kind]
    satisfiedProfile: descriptive
    rule: "A file with an OWP apiVersion declares its kind."
  asset-foreign-yaml:
    valid: true
    satisfiedProfile: descriptive
    rule: "YAML files without an OWP apiVersion (here a Kubernetes manifest) are ordinary package files."
  asset-nested-package:
    valid: true
    satisfiedProfile: descriptive
    rule: "Discovery does not enter a subdirectory with its own owp.yaml; that package's assets are not this package's."
  asset-kind-reserved:
    valid: true
    warnings: [asset.kind-reserved]
    satisfiedProfile: descriptive
    rule: "A reserved vocabulary kind has no schema or rules yet; using it is a warning."
  view-external-world-undeclared:
    valid: false
    errors: [view.external-world]
    satisfiedProfile: model-ready
    rule: "A projection.include entry <world ref>#<name> uses a World listed in spec.externalWorldRefs."
  view-external-world-not-dependency:
    valid: false
    errors: [view.external-world]
    satisfiedProfile: model-ready
    rule: "Each spec.externalWorldRefs entry is also listed in spec.dependencies."
  view-in-world-model-package:
    valid: false
    errors: [view.world-ref]
    rule: "A World View belongs to a World; a WorldViewProfile in a WorldModelPackage is an error."
  view-outside-world:
    valid: true
    warnings: [view.outside-world]
    satisfiedProfile: model-ready
    rule: "When spec.world.boundary.included is declared, a View's projection.include selects from it."
  compiler-field-outside-view:
    valid: true
    warnings: [compiler.field-outside-view]
    satisfiedProfile: model-ready
    rule: "A State Compiler field <entity>.<property> names an entity its View's projection.include lists."
  package-ignore:
    valid: true
    satisfiedProfile: descriptive
    rule: "Files that .owpignore excludes (a directory, a name at any depth, a root-anchored path) are not package files, so discovery does not read them; a file inside an excluded directory cannot be re-included."
  package-ignore-negation:
    valid: false
    errors: [asset.kind]
    satisfiedProfile: descriptive
    rule: "A later !pattern in .owpignore re-includes a file that an earlier pattern excluded; discovery reads it again."
  package-ignore-listed-example:
    valid: false
    errors: [asset.missing-file]
    satisfiedProfile: descriptive
    rule: "A listed PackageExample that .owpignore excludes is not a package file."
  asset-api-version-mismatch:
    valid: false
    errors: [asset.api-version]
    satisfiedProfile: descriptive
    rule: "An asset that declares apiVersion must use the manifest's."
resolutionCases:
  view-external-world:
    valid: true
    warnings: [view.outside-world]
    resolved:
      conformance/supplier@1.0.0: null
    rule: "A View reads another World it lists in spec.externalWorldRefs; a name taken from it outside that World's boundary is a warning."
  dependency-direction:
    valid: true
    warnings: [resolve.dependency-direction]
    resolved:
      conformance/taxonomy@1.0.0: null
    rule: "Dependencies point down the hierarchy Ontology <- World <- World Model; an OntologyPackage that depends on a WorldPackage is a warning."
  grounded:
    valid: true
    resolved:
      conformance/world@0.1.0: null
    rule: "Grounding paths exist in the referenced World with the right kinds, and the compiler compiles a compatible View."
  unresolvable-world:
    valid: false
    errors: [resolve.unresolved]
    rule: "Resolution is by exact version; 0.1.0 does not satisfy 0.2.0."
  world-ref-not-a-dependency:
    valid: false
    errors: [grounding.world-not-dependency]
    rule: "semanticGrounding.worldRef must be listed in spec.dependencies."
  view-missing-in-world:
    valid: false
    errors: [grounding.world-view]
    rule: "Every compatibleWorldViews path must be a WorldViewProfile asset of the referenced World."
  view-path-wrong-kind:
    valid: false
    errors: [grounding.world-view]
    rule: "A compatibleWorldViews path that names a StateCompilerProfile is rejected."
  compiler-missing-in-world:
    valid: false
    errors: [grounding.state-compiler]
    rule: "Every compatibleStateCompilers path must be a StateCompilerProfile asset of the referenced World."
  compiler-view-not-compatible:
    valid: false
    errors: [grounding.compiler-view]
    rule: "Each compatible State Compiler must compile one of the model's compatibleWorldViews."
  version-conflict:
    valid: false
    errors: [resolve.version-conflict]
    rule: "One package name may resolve to only one version in a dependency closure."
  dependency-cycle:
    valid: false
    errors: [resolve.cycle]
    rule: "Dependency cycles are rejected."
  invalid-dependency:
    valid: false
    errors: [resolve.dependency-invalid]
    rule: "A resolved dependency must itself be valid."
  descriptive-dependency:
    valid: true
    resolved:
      conformance/world@0.1.0: null
      conformance/taxonomy@1.0.0: null
    rule: "A descriptive World (no View/State Compiler) is a valid dependency."
  archive-source:
    valid: true
    resolved:
      conformance/world@0.1.0: sha256:9288f55a701880fba1b58269a990935460b639fc534ad7136e0a261e41f1656b
    rule: "A .owp.zip in a directory source is resolved after its lock verifies."
  archive-tampered:
    valid: false
    errors: [resolve.source]
    rule: "An archive whose file hash differs from owp.lock.json is rejected."
  archive-unlocked-file:
    valid: false
    errors: [resolve.source]
    rule: "An archive containing a file not listed in owp.lock.json is rejected."
  dependency-mapping-source:
    valid: true
    resolved:
      conformance/world@0.1.0: null
    rule: "A {ref, source} dependency uses its source, resolved against the declaring package directory."
  diamond:
    valid: true
    resolved:
      conformance/world@0.1.0: null
      conformance/taxonomy@1.0.0: null
    rule: "The same exact version reached twice is not a conflict."
  world-ref-not-world:
    valid: false
    errors: [grounding.world-kind]
    rule: "semanticGrounding.worldRef must resolve to a WorldPackage."
  non-root-model-grounding:
    valid: false
    errors: [grounding.world-view]
    rule: "Cross-package grounding rules apply to every WorldModelPackage in the closure, not only the root."
  git-bundle-source:
    valid: true
    resolved:
      conformance/world@0.1.0: git:53f8511cc0fc8e391a064b1eb6d85bf635412a14
    rule: "A git source (here a git bundle, resolved relative to the declaring package) is fetched at the tag; the package is found under #subdir."
  git-missing-rev:
    valid: false
    errors: [resolve.source]
    rule: "A git source whose rev does not exist is a source error."
  hidden-directory-skipped:
    valid: false
    errors: [resolve.unresolved]
    rule: "Directories whose name starts with '.' are not scanned."

# EWS compile cases: run <case>/world's compiler over <case>/observations.yaml at asOf.
# Compare with <case>/expected-ews.yaml on worldRef, worldView, stateCompiler, asOf, state, unresolved, missing (as a set), provenance (as sets).
# error: true means a conforming compiler must refuse the input.
  extension-defined:
    valid: true
    resolved:
      acme/safety-extension@1.0.0: null
    rule: "A dependency declared with 'as' resolves to a package that declares spec.extensionDefinition."
  extension-without-definition:
    valid: false
    errors: [extension.definition]
    rule: "A dependency declared with 'as' must resolve to a package that declares spec.extensionDefinition."
  binding-grounded:
    valid: true
    resolved:
      conformance/onto@0.1.0: null
    rule: "Binding CURIEs expand with the dependency ontology's prefixes to terms it defines."
  binding-prefix-unknown:
    valid: false
    errors: [grounding.prefix-unknown]
    rule: "A binding prefix must be declared by a dependency OntologyPackage."
  binding-term-unknown:
    valid: false
    errors: [grounding.ontology-term]
    rule: "An expanded binding IRI must be a term of a dependency OntologyPackage."
  binding-prefix-conflict:
    valid: false
    errors: [grounding.prefix-conflict]
    rule: "Two dependency ontologies may not declare one prefix with different IRIs."
ewsCases:
  latest-picks-newest:
    compiler: state/task-compiler.yaml
    asOf: "2026-01-01T00:00:10Z"
    rule: "select latest takes the value with the greatest observedAt."
  schema-ref-fields:
    compiler: state/task-compiler.yaml
    asOf: "2026-01-01T00:00:10Z"
    rule: "A compiler with only outputSchemaRef compiles the fields listed by the schema's top-level properties."
  latest-tie-same-value:
    compiler: state/task-compiler.yaml
    asOf: "2026-01-01T00:00:10Z"
    rule: "Equal values at the newest time resolve to that value; provenance lists every tied observation."
  latest-tie-conflict:
    compiler: state/task-compiler.yaml
    asOf: "2026-01-01T00:00:10Z"
    rule: "Different values at the newest time are unresolved; alternatives are kept in (observedAt, id) order, first occurrence wins."
  all-ordered:
    compiler: state/task-compiler.yaml
    asOf: "2026-01-01T00:00:10Z"
    rule: "select all returns values ordered by (observedAt, id)."
  as-of-excludes-future:
    compiler: state/task-compiler.yaml
    asOf: "2026-01-01T00:00:03Z"
    rule: "Observations after asOf are ignored; observedAt equal to asOf is included."
  no-candidates-missing:
    compiler: state/task-compiler.yaml
    asOf: "2026-01-01T00:00:10Z"
    rule: "A bound field with no matching observation (type and value key) is missing; unbound fields are always missing."
  json-bool-vs-number:
    compiler: state/task-compiler.yaml
    asOf: "2026-01-01T00:00:10Z"
    rule: "Values compare in the JSON data model: true and 1 differ, so the field is unresolved."
  json-int-vs-float:
    compiler: state/task-compiler.yaml
    asOf: "2026-01-01T00:00:10Z"
    rule: "Numbers compare numerically: 1 and 1.0 are equal, so the field resolves."
  json-structured-values:
    compiler: state/task-compiler.yaml
    asOf: "2026-01-01T00:00:10Z"
    rule: "Mappings compare by key set and values, independent of key order."
  null-value:
    compiler: state/task-compiler.yaml
    asOf: "2026-01-01T00:00:10Z"
    rule: "A null value is a value: the newest observation sets the field to null."
  id-code-point-order:
    compiler: state/task-compiler.yaml
    asOf: "2026-01-01T00:00:10Z"
    rule: "Ties on observedAt order by id in Unicode code point order ('o10' < 'o9')."
  unquoted-utc-timestamp:
    compiler: state/task-compiler.yaml
    asOf: "2026-01-01T00:00:10Z"
    rule: "An unquoted timestamp is read as its source text, not converted."
  error-unquoted-non-utc-timestamp:
    compiler: state/task-compiler.yaml
    asOf: "2026-01-01T00:00:10Z"
    error: true
    errors: [ews.input]
    rule: "An unquoted non-UTC timestamp is read as text and rejected, never converted to UTC."
  error-missing-values:
    compiler: state/task-compiler.yaml
    asOf: "2026-01-01T00:00:10Z"
    error: true
    errors: [ews.input]
    rule: "Each observation needs a values mapping."
  error-invalid-calendar-as-of:
    compiler: state/task-compiler.yaml
    asOf: "2026-02-30T00:00:00Z"
    error: true
    errors: [ews.input]
    rule: "asOf must be a valid calendar instant."
  error-opaque-compiler:
    compiler: state/task-compiler.yaml
    asOf: "2026-01-01T00:00:10Z"
    error: true
    errors: [ews.opaque-compiler]
    rule: "A compiler without bindings is opaque; compiling it is refused."
  error-duplicate-id:
    compiler: state/task-compiler.yaml
    asOf: "2026-01-01T00:00:10Z"
    error: true
    errors: [ews.input]
    rule: "Duplicate observation ids are rejected."
  error-non-utc-timestamp:
    compiler: state/task-compiler.yaml
    asOf: "2026-01-01T00:00:10Z"
    error: true
    errors: [ews.input]
    rule: "observedAt must be UTC YYYY-MM-DDTHH:MM:SSZ."

# EWS check cases: check <case>/ews.yaml against <case>/world's State Compiler output contract.
  observation-extensions:
    compiler: state/task-compiler.yaml
    asOf: "2026-01-01T00:00:03Z"
    rule: "extensions blocks on the ObservationSet and on observations are allowed and do not affect compilation."
  error-unknown-field:
    compiler: state/task-compiler.yaml
    asOf: "2026-01-01T00:00:03Z"
    error: true
    errors: [schema.unknown-field]
    rule: "An observation key that is neither defined nor an extensions block makes the input invalid."
ewsCheckCases:
  valid:
    valid: true
    rule: "A complete EWS document satisfying the compiler's output contract."
  field-in-two-places:
    valid: false
    errors: [ews.field-placement]
    rule: "Each schema field appears in exactly one of state, unresolved, missing."
  field-absent:
    valid: false
    errors: [ews.field-placement]
    rule: "A schema field that appears nowhere is rejected."
  field-not-in-schema:
    valid: false
    errors: [ews.field-unknown]
    rule: "Fields outside outputSchema are rejected."
  missing-provenance:
    valid: false
    errors: [ews.provenance-required]
    rule: "With traceRequired, every valued field needs provenance."
  view-mismatch:
    valid: false
    errors: [ews.world-view]
    rule: "worldView must be the View compiled by stateCompiler."
  world-ref-mismatch:
    valid: false
    errors: [ews.world-ref]
    rule: "worldRef must be the World's identity."
  bad-as-of:
    valid: false
    errors: [ews.as-of]
    rule: "context.asOf must be a UTC timestamp."
  provenance-orphan:
    valid: false
    errors: [ews.provenance-orphan]
    rule: "Provenance only for fields with a value."
  duplicate-alternatives:
    valid: false
    errors: [ews.unresolved-alternatives]
    rule: "Unresolved alternatives must be at least two distinct values."
  trace-not-required:
    valid: true
    rule: "Without traceRequired, provenance may be omitted."
  schema-ref-valid:
    valid: true
    rule: "A compiler with only outputSchemaRef takes its EWS fields from the top-level properties of that JSON Schema."
  schema-ref-field-unknown:
    valid: false
    errors: [ews.field-unknown]
    rule: "Field rules apply to the fields of outputSchemaRef as to outputSchema.fields."
  wrong-kind:
    valid: false
    errors: [ews.kind]
    rule: "The document kind must be EffectiveWorldState."
  single-alternative:
    valid: false
    errors: [ews.unresolved-alternatives]
    rule: "An unresolved field retains at least two alternatives."
  unknown-field:
    valid: false
    errors: [schema.unknown-field]
    rule: "An EWS key that is neither defined nor an extensions block is an error."
  extensions:
    valid: true
    rule: "extensions blocks in spec and spec.context are allowed and ignored by the output contract and EWS equality."
extractionCases:
  basic:
    parameters: {"claimId": "C-102"}
    snapshot: "2026-09-01T00:00:00Z"
    rule: "Rows become observations per entry ordered by id; repeated rows from a join collapse; observedAt falls back to the snapshot; provenance records the extraction."
  null-id-skipped:
    parameters: {"claimId": "C-102"}
    snapshot: "2026-09-01T00:00:00Z"
    rule: "A row with a null or absent id column yields nothing for that entry."
  no-values-skipped:
    parameters: {"claimId": "C-102"}
    snapshot: "2026-09-01T00:00:00Z"
    rule: "A row whose mapped value columns are all null yields nothing."
  non-string-id:
    parameters: {}
    snapshot: "2026-09-01T00:00:00Z"
    rule: "Non-string id values use their JSON text; ordering is by the resulting id string."
  integral-float-id:
    parameters: {}
    snapshot: "2026-09-01T00:00:00Z"
    rule: "Numbers in ids use their shortest form without a fraction when integral; booleans are true or false."
  non-scalar-id:
    parameters: {}
    snapshot: "2026-09-01T00:00:00Z"
    error: true
    errors: ["extraction.input"]
    rule: "An array or mapping id value is invalid input."
  conflicting-duplicate:
    parameters: {"claimId": "C-102"}
    snapshot: "2026-09-01T00:00:00Z"
    error: true
    errors: ["extraction.input"]
    rule: "The same id with different values is invalid input."
  parameter-missing:
    parameters: {}
    snapshot: "2026-09-01T00:00:00Z"
    error: true
    errors: ["extraction.input"]
    rule: "Every declared parameter needs a value."
  parameter-undeclared:
    parameters: {"claimId": "C-102", "site": "S-1"}
    snapshot: "2026-09-01T00:00:00Z"
    error: true
    errors: ["extraction.input"]
    rule: "An undeclared parameter is invalid input."
  parameter-wrong-type:
    parameters: {"limit": "10"}
    snapshot: "2026-09-01T00:00:00Z"
    error: true
    errors: ["extraction.input"]
    rule: "A parameter value must have its declared type."
  bad-timestamp:
    parameters: {"claimId": "C-102"}
    snapshot: "2026-09-01T00:00:00Z"
    error: true
    errors: ["extraction.input"]
    rule: "observedAt values must be valid UTC timestamps."
  no-snapshot:
    parameters: {"claimId": "C-102"}
    error: true
    errors: ["extraction.input"]
    rule: "Without a snapshot, rows that need the snapshot default cannot get an observedAt."
