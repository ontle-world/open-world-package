apiVersion: openworld/v1alpha1
kind: StateCompilerProfile
metadata:
  name: task-compiler
spec:
  worldViewRef: views/task.yaml
  outputContract: EffectiveWorldState
  outputSchema:
    fields: [m.alarms, m.risk, m.state, m.state_class, m.code, m.code_class]
    perSubject: [m.alarms, m.risk, m.state, m.state_class]
    latent: [m.alarms, m.risk, m.state_class, m.code_class]
  bindings:
    m.alarms: {aggregate: {from: ot.alarm, value: code, function: count}}
    m.risk:
      classify:
        input: m.alarms
        criterion:
          id: alarm-escalation
          version: 1.2.0
          basis: docs/alarm-escalation-sop.md
          rules:
          - {when: {gte: 3}, label: high}
          - {when: {gte: 2, lt: 3}, label: elevated}
          otherwise: normal
    m.state: {from: ot.state, value: v, select: latest}
    m.state_class:
      classify:
        input: m.state
        criterion:
          id: availability
          rules:
          - {when: {in: [down, blocked]}, label: unavailable}
          - {when: {eq: running}, label: available}
    m.code: {from: ot.code, value: v, select: latest}
    m.code_class:
      classify:
        input: m.code
        criterion:
          id: code-bands
          rules:
          - {when: {gt: 100}, label: severe}
