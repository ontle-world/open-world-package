apiVersion: openworld/v1alpha1
kind: TaskSetProfile
metadata:
  name: account-priority
spec:
  task:
    workPatterns: [prioritize, allocate]
  requires:
    worldViews: [views/account-manager.yaml]
    knowledge: [knowledge/win-loss-playbook.yaml]
    actors: [actors/sales-manager.yaml, actors/sales-agent.yaml]
  workPatternRefs: [patterns/prioritize.yaml, patterns/allocate.yaml]
  produces:
    artifacts: [artifacts/priority-board.yaml]
