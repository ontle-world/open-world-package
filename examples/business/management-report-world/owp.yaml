apiVersion: openworld/v1alpha1
kind: WorldPackage
metadata:
  namespace: openworld-examples
  name: management-report-world
  version: 0.1.0
  title: Management Report World
  license: Apache-2.0
spec:
  domains:
  - management
  world:
    description: WORLD.md
    definition: Business units, their financial results and operating KPIs, open risks, strategic initiatives, and the periodic reports leadership receives about them.
    boundary:
      included: [business_unit, kpi, financial_result, risk, initiative, reporting_period, report]
      excluded: [general_ledger_postings, payroll, individual_performance_reviews]
    defaultView: views/executive.yaml
    defaultStateCompiler: state/executive-summary-compiler.yaml
  conformance:
    profile: model-ready
  validity:
    limitations:
    - Illustrative example; no real financial data. Uses experimental asset kinds (spec Appendix C).
  assets:
  - kind: WorldViewProfile
    path: views/enterprise-base.yaml
  - kind: WorldViewProfile
    path: views/executive.yaml
  - kind: WorldViewProfile
    path: views/report-agent.yaml
  - kind: StateCompilerProfile
    path: state/executive-summary-compiler.yaml
  - kind: WorkPatternProfile
    path: patterns/synthesize.yaml
  - kind: WorkPatternProfile
    path: patterns/create-report.yaml
  - kind: TaskSetProfile
    path: tasks/monthly-management-report.yaml
  - kind: ArtifactContract
    path: artifacts/management-report.yaml
  - kind: KnowledgeAsset
    path: knowledge/kpi-definitions.yaml
  - kind: KnowledgeAsset
    path: knowledge/reporting-policy.yaml
  - kind: CapabilityContract
    path: capabilities/bi-read.yaml
  - kind: ActorProfile
    path: actors/executive.yaml
  - kind: ActorProfile
    path: actors/finance-controller.yaml
  - kind: ActorProfile
    path: actors/report-agent.yaml
  - kind: RoleProfile
    path: roles/executive.yaml
  - kind: RoleProfile
    path: roles/finance-controller.yaml
  - kind: DelegationProfile
    path: delegations/report-drafting.yaml
  - kind: ConsumerRepresentationProfile
    path: consumers/executive.yaml
  - kind: ConsumerRepresentationProfile
    path: consumers/report-agent.yaml
  - kind: EvaluationProfile
    path: eval/report-approval.yaml
  - kind: PackageExample
    path: examples/observations.yaml
  - kind: PackageExample
    path: examples/expected-ews.yaml
