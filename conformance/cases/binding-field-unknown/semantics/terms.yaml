apiVersion: openworld/v1alpha1
kind: SemanticBinding
metadata: {name: terms}
spec:
  terms: {claim: q:Claim, lot: q:Lot}
  fields:
    claim.status: {class: q:Claim, path: [q:claimStatus]}
    lot.genealogy: {class: q:Lot, path: [q:derivedFrom]}
    capa.status: {class: q:Capa, path: [q:capaStatus]}
  observationTypes: {QMS.claim: q:Claim}
  actions: {propose_capa: q:ProposeCapa}
