apiVersion: openworld/v1alpha1
kind: WorldPackage
metadata:
  namespace: openworld-examples
  name: manufacturing-quality-world
  version: 0.1.0
  title: Manufacturing Quality World
  license: Apache-2.0
spec:
  dependencies:
  - openworld-examples/quality-ontology@0.1.0
  domains:
  - manufacturing
  - quality
  world:
    description: WORLD.md
    definition: Quality incidents, lots, equipment, evidence, constraints, decisions,
      CAPA actions, and outcomes.
    boundary:
      included:
      - quality_incident
      - lot
      - equipment
      - inspection
      - claim
      - decision
      - capa
      - outcome
      excluded:
      - complete_mes_implementation
      - complete_qms_implementation
    defaultView: views/quality-incident-task.yaml
    defaultStateCompiler: state/quality-incident-compiler.yaml
    semanticBinding: semantics/quality-terms.yaml
  conformance:
    profile: action-ready
  capabilities:
  - explore
  - state_tracking
  - audit
  - decision_support
  validity:
    limitations:
    - Reference semantic package; source systems remain external.
  assets:
  - kind: WorldViewProfile
    path: views/quality-incident-task.yaml
  - kind: SemanticBinding
    path: semantics/quality-terms.yaml
  - kind: StateCompilerProfile
    path: state/quality-incident-compiler.yaml
  - kind: SourceSystemSchemaProfile
    path: interfaces/sources.yaml
  - kind: ObservationAcquisitionProfile
    path: interfaces/observations.yaml
  - kind: ActionBindingProfile
    path: interfaces/actions.yaml
  - kind: CommitContract
    path: interfaces/commit.yaml
  - kind: EffectVerificationProfile
    path: interfaces/effect-verification.yaml
  - kind: ScenarioProfile
    path: scenarios/claim-rca.yaml
  - kind: WorkPatternProfile
    path: patterns/diagnose.yaml
  - kind: KnowledgeAsset
    path: knowledge/rca-playbook.yaml
  - kind: ArtifactContract
    path: artifacts/rca-report.yaml
  - kind: KnowledgeAsset
    path: knowledge/plant-kg.yaml
  - kind: KnowledgeExtractionProfile
    path: extraction/claim-context.yaml
  - kind: ActorProfile
    path: actors/quality-manager.yaml
  - kind: ActorProfile
    path: actors/quality-team.yaml
  - kind: ActorProfile
    path: actors/rca-agent.yaml
  - kind: ActorProfile
    path: actors/plant-director.yaml
  - kind: RoleProfile
    path: roles/quality-manager.yaml
  - kind: AgentProfile
    path: agents/rca-agent.yaml
  - kind: DelegationProfile
    path: delegations/rca-agent.yaml
  - kind: CapabilityContract
    path: capabilities/rca-analysis.yaml
  - kind: EvaluationProfile
    path: eval/rca-report-review.yaml
  - kind: ScenarioProfile
    path: scenarios/quality-hold.yaml
  - kind: TaskSetProfile
    path: tasks/claim-rca.yaml
  - kind: ConsumerRepresentationProfile
    path: consumers/quality-manager.yaml
  - kind: PackageExample
    path: examples/basic.yaml
  - kind: PackageExample
    path: examples/observations.yaml
  - kind: PackageExample
    path: examples/expected-ews.yaml
  - kind: PackageExample
    path: examples/kg-observations.yaml
  - kind: PackageExample
    path: examples/expected-ews-with-kg.yaml
