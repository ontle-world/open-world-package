apiVersion: openworld/v1alpha1
kind: Dataset
metadata:
  name: manipulation-episodes
spec:
  worldViewRef: views/pick-place-task.yaml
  structure: episodic
  standardBindings:
    episodes:
      standard: lerobot
      license: Apache-2.0
      ref:
        provider: huggingface
        uri: hf://datasets/k-chan-l/lekiwi_pick_and_place2
        revision: de33a7ae7c1769d042e1303894df3b7ea804de21
  note: >-
    LeRobot v3.0 episodes of a LeKiwi mobile manipulator (50 episodes, 30 fps): front and wrist cameras,
    five arm joints, a gripper, and measured base velocities (x, y, theta) in observation.state, the
    teleoperation command for the same in action, and the instruction
    "Pick up the cube, drive to the basket and place it in". The State Compiler needs only meta/ and data/
    (parquet); the AV1 videos are not read.
