apiVersion: openworld/v1alpha1
kind: WorkPatternProfile
metadata:
  name: synthesize
spec:
  pattern: {kind: summarize, family: analyze_reason}
  objective: explain_period_results_against_targets
  inputs: {semanticRoles: [observation, target, prior_period, evidence]}
  outputs: {semanticRoles: [summary, variance_explanation]}
  optionalCapabilities: [rule, llm, statistics]
  worldViewRef: views/executive.yaml
  graph:
    nodes:
    - {id: collect, family: observe_knowledge, patternKind: retrieve}
    - {id: compare, family: analyze_reason, patternKind: compare}
    - {id: explain, family: analyze_reason, patternKind: analyze}
    - {id: summarize, family: analyze_reason, patternKind: summarize}
    transitions:
    - {from: collect, to: compare}
    - {from: compare, to: explain}
    - {from: explain, to: collect, guard: evidence_missing}
    - {from: explain, to: summarize, guard: variances_explained}
    guards: [{id: evidence_missing}, {id: variances_explained}]
    loops: [{nodes: [collect, compare, explain], maxIterations: 2, until: variances_explained}]
