apiVersion: openworld/v1alpha1
kind: RoleProfile
metadata: {name: finance-controller}
spec:
  permissions:
  - {actions: [read_financial_results, draft_report, review_report], scope: enterprise}
  authorities:
  - {decisions: [sign_off_figures], scope: enterprise}
  responsibilities: [report_accuracy]
  accountabilities: [reported_figures]
