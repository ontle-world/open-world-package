apiVersion: openworld/v1alpha1
kind: OntologyPackage
metadata:
  namespace: example
  name: my-ontology
  version: 0.1.0
  title: My Ontology
  license: Apache-2.0
spec:
  ontology:
    description: ONTOLOGY.md
    iri: https://example.org/my-ontology#
    prefixes:
      ex: https://example.org/my-ontology#
    entrypoints:
    - {path: semantics/core.yaml, format: owp-yaml, role: schema}
  conformance:
    profile: schema
  assets:
  - kind: SemanticProfile
    path: semantics/core.yaml
