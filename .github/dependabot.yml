version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /implementations/typescript
    schedule:
      interval: weekly
    ignore:
      # Types follow the oldest Node.js major in CI (package.json engines), not the newest release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
