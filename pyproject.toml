[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ontle"
version = "0.2.0a4"
description = "Reference CLI and tooling for Open World Packages (OWP): validate, compile state, pack, and publish Worlds and World Models"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"  # the code and the vocab files the wheel ships; spec/ and docs/ (CC BY 4.0) are not in it
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "FutureWorkLab"}]
keywords = ["open-world-package", "owp", "world-model", "ontology", "digital-twin", "physical-ai"]
dependencies = ["PyYAML>=6.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/ontle-world/open-world-package"
Source = "https://github.com/ontle-world/open-world-package"
Changelog = "https://github.com/ontle-world/open-world-package/blob/main/CHANGELOG.md"
Issues = "https://github.com/ontle-world/open-world-package/issues"

[project.optional-dependencies]
# RDF tooling for `ontle ontology index` on RDF entrypoints. Validation never needs it.
rdf = ["rdflib>=7.0", "pyoxigraph>=0.5"]  # pyoxigraph reads RDF 1.2 (ews compile --rdf output)
# Checking RDF output against vocab/owp/shapes.ttl (tests only).
shacl = ["pyshacl>=0.30"]
# Reading LeRobot parquet files in demos/physical-ai/extract.py.
demo = ["pyarrow>=15"]
# The LLM World Model in examples/business/quality-scenario-world-model.
llm = ["anthropic"]

[project.scripts]
ontle = "ontle.cli:main"

[tool.setuptools]
# vocab/ is a specification artifact at the repository root; it ships as ontle.vocab.
package-dir = {"" = "src", "ontle.vocab" = "vocab"}
packages = ["ontle", "ontle.vocab"]
include-package-data = false  # package-data below lists the data files

[tool.setuptools.package-data]
ontle = ["templates/**/*"]
"ontle.vocab" = ["*.yaml"]
