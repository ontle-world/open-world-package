apiVersion: openworld/v1alpha1
kind: StateCompilerProfile
metadata:
  name: task-compiler
spec:
  worldViewRef: views/task.yaml
  outputContract: EffectiveWorldState
  outputSchema:
    fields: [m.temp, m.overheat]
    latent: [m.overheat]
    units: {m.temp: Cel}
  bindings:
    m.temp: {from: ot.temp, value: c}
    m.overheat:
      classify:
        input: m.temp
        criterion: {id: overheat, unit: "[degF]", rules: [{when: {gt: 176}, label: hot}]}
