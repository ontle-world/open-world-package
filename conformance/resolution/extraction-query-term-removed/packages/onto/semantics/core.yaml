apiVersion: openworld/v1alpha1
kind: SemanticProfile
metadata: {name: core}
spec:
  types:
  - id: q:Claim
    properties:
    - {id: q:claimStatus}
  - id: q:Lot
    properties:
    - {id: q:derivedFrom, range: q:Lot}
  - id: q:ProposeCapa
  removed:
  - {id: q:partOf, replacedBy: q:derivedFrom, removedIn: 0.1.0}
