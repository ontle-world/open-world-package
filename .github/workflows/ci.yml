name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      # The newest Python also installs the rdf extra, so RDF export, kg check, and SPARQL extraction are tested.
      - run: python -m pip install -e ${{ matrix.python-version == '3.14' && '.[rdf]' || '.' }}
      - run: ./scripts/golden_smoke.sh

  typescript-conformance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["24", "26"]
    defaults:
      run:
        working-directory: implementations/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: implementations/typescript/package-lock.json
      - run: npm ci
      - run: npm test
