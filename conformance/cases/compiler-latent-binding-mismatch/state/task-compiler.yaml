apiVersion: openworld/v1alpha1
kind: StateCompilerProfile
metadata:
  name: task-compiler
spec:
  worldViewRef: views/task.yaml
  outputContract: EffectiveWorldState
  outputSchema:
    fields: [m.count, m.state]
    latent: [m.state]
  bindings:
    m.count: {aggregate: {from: ot.alarm, value: code, function: count}}
    m.state: {from: ot.state, value: v}
