apiVersion: openworld/v1alpha1
kind: ConsumerRepresentationProfile
metadata:
  name: executive
spec:
  actor: {kind: human, ref: actors/executive.yaml}
  worldViewRef: views/executive.yaml
  representation: {mode: document, provenance: required}
  human:
    artifactContractRefs: [artifacts/management-report.yaml]
    presentation: document
    decisionRights: [approve_report, publish_report]
