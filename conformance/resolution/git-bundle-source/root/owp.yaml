apiVersion: openworld/v1alpha1
kind: WorldModelPackage
metadata:
  namespace: conformance
  name: model
  version: 0.1.0
spec:
  dependencies:
  - ref: conformance/world@0.1.0
    source: git+../world.bundle@v0.1.0#subdir=world
  worldModel:
    description: WORLDMODEL.md
    roles: [dynamics_prediction]
    semanticGrounding:
      worldRef: conformance/world@0.1.0
      compatibleWorldViews:
      - conformance/world@0.1.0#views/task.yaml
      compatibleStateCompilers:
      - conformance/world@0.1.0#state/task-compiler.yaml
    inputs:
      contract: EffectiveWorldState
    representation:
      adapterRef: models/adapter.yaml
  assets:
  - kind: ModelArtifact
    path: models/model-artifact.yaml
  - kind: RepresentationAdapterProfile
    path: models/adapter.yaml
  - kind: EvaluationProfile
    path: eval/profile.yaml
