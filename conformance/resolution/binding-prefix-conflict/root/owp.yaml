apiVersion: openworld/v1alpha1
kind: WorldPackage
metadata:
  namespace: conformance
  name: world
  version: 0.1.0
spec:
  dependencies:
  - conformance/onto@0.1.0
  - conformance/onto-b@0.1.0
  world:
    description: WORLD.md
    definition: Conformance fixture World.
    boundary:
      included: [claim, lot]
    defaultView: views/task.yaml
    defaultStateCompiler: state/task-compiler.yaml
    semanticBinding: semantics/terms.yaml
  conformance:
    profile: model-ready
  assets:
  - kind: WorldViewProfile
    path: views/task.yaml
  - kind: StateCompilerProfile
    path: state/task-compiler.yaml
  - kind: SemanticBinding
    path: semantics/terms.yaml
