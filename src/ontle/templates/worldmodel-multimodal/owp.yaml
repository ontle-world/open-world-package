apiVersion: openworld/v1alpha1
kind: WorldModelPackage
metadata:
  namespace: example
  name: multimodal-world-model
  version: 0.1.0
  title: Multimodal Action World Model
  description: One line on what this multimodal model predicts and for which World.
  license: Apache-2.0
spec:
  domains:
  - physical-ai
  - robotics
  worldModel:
    description: WORLDMODEL.md
    roles:
    - state_estimation
    - dynamics_prediction
    - observation_prediction
    - action_policy
    semanticGrounding:
      worldRef: replace-with-namespace/replace-with-world@0.1.0
      compatibleWorldViews:
      - replace-with-namespace/replace-with-world@0.1.0#views/default.yaml
      compatibleStateCompilers:
      - replace-with-namespace/replace-with-world@0.1.0#state/default-compiler.yaml
    modalities:
      inputs:
      - rgb
      - language
      - proprioception
      - action_history
      outputs:
      - latent_state
      - predicted_observation
      - action
      - trajectory
    representation:
      mode: hybrid
      adapterRef: models/adapter.yaml
    temporal:
      contextWindow: 8_steps
      predictionWindow: 4_steps
      actionHorizon: 4_steps
    validity:
      limitations:
      - Reference contract only; no checkpoint is bundled.
    inputs:
      contract: EffectiveWorldState
