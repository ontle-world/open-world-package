apiVersion: openworld/v1alpha1
kind: SemanticProfile
metadata: {name: core}
spec:
  types:
  - id: q:Claim
    properties:
    - {id: q:claimStatus, range: q:ClaimStatus}
  - id: q:ClaimStatus
    enum: [open, closed]
  - id: q:Lot
    properties:
    - {id: q:derivedFrom, range: q:Lot}
  - id: q:ProposeCapa
  - id: q:Open
  - id: q:OnHold
