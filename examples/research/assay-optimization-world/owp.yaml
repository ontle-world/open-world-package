apiVersion: openworld/v1alpha1
kind: WorldPackage
metadata:
  namespace: openworld-examples
  name: assay-optimization-world
  version: 0.1.0
  title: Assay Optimization World
  license: Apache-2.0
spec:
  domains:
  - scientific_research
  - laboratory
  world:
    description: WORLD.md
    definition: Assays, plates, reagents, instruments, experiment runs, measurements,
      and the protocols that produce them.
    boundary:
      included:
      - assay
      - plate
      - reagent
      - instrument
      - experiment_run
      - measurement
      - protocol
      excluded:
      - lims_implementation
      - instrument_control_software
    defaultView: views/scientist.yaml
  conformance:
    profile: viewable
  validity:
    limitations:
    - Illustrative example; no real laboratory data. Uses experimental asset kinds
      (spec Appendix C).
  assets:
  - kind: PackageExample
    path: examples/baseline-observations.yaml
