      ref:
        provider: https
        uri: https://raw.githubusercontent.com/information-artifact-ontology/IAO/v2026-03-30/iao.owl
        digest: sha256:c27ff2964a2ad8165bc365698b628aae95108411384aa4450e6e1b1e82bf0f41
    termIndex: semantics/terms.yaml
